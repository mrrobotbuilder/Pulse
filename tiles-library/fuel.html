<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuel</title>
<!--
  Fuel: water, glass by glass. Built on the tile kit (lib/tiles/tileKit.ts,
  injected by the board). Sealed: no network; saves through window.Vitality.
  Saved shape (lib/tiles/tileStats.ts reads `water` and `goal`):
    { water: { 'YYYY-MM-DD': glasses }, goal: 8, glassMl: 250,
      times: { 'YYYY-MM-DD': ['HH:MM', ...] } }
-->
<style>
  .pace{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .quick .k-btn{flex-direction:column;gap:2px;min-height:74px;padding:8px}
  .quick .k-btn small{font:500 12px var(--k-body);opacity:.85}
  .month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .month i{aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--k-tint) calc(var(--p) * 100%),color-mix(in srgb,var(--k-text) 7%,transparent));display:block}
  .month i.full{box-shadow:0 0 0 2px var(--k-surface),0 0 0 3.5px var(--k-tint)}
  .month i.future{background:transparent;border:1px dashed var(--k-hair)}
  .month b{font:500 10.5px var(--k-mono);color:var(--k-muted);text-align:center}
  .times{display:flex;flex-wrap:wrap;gap:6px}
</style>
</head>
<body class="k-hue-blue">
<main class="k-page" id="app" aria-live="polite"></main>
<script>
var K=window.PulseKit;
var store={};
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function goal(){return typeof store.goal==='number'&&store.goal>0?store.goal:8}
function ml(){return typeof store.glassMl==='number'&&store.glassMl>0?store.glassMl:250}
function water(){if(!store.water||typeof store.water!=='object'||Array.isArray(store.water))store.water={};return store.water}
function times(){if(!store.times||typeof store.times!=='object'||Array.isArray(store.times))store.times={};return store.times}
function on(d){return water()[K.dayKey(d)]||0}
function ago(n){var d=new Date();d.setDate(d.getDate()-n);return d}
function liters(g){return K.fmt(g*ml()/1000,2)+' L'}
function persist(){return Promise.resolve(window.Vitality.save(store)).catch(function(e){K.toast('Could not save: '+(e&&e.message||e))})}

function add(n){
  var k=K.dayKey(),w=water(),t=times();
  w[k]=Math.max(0,(w[k]||0)+n);
  if(!Array.isArray(t[k]))t[k]=[];
  if(n>0){var d=new Date(),s=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');for(var i=0;i<n;i++)t[k].push(s)}
  else t[k].splice(Math.max(0,t[k].length+n),-n);
  persist();render();
  if(n>0&&w[k]===goal())K.toast('Goal reached. '+liters(w[k])+' today.');
}

/* Where you should be by now, if the day runs 07:00 to 22:00. */
function pace(){
  var h=new Date().getHours()+new Date().getMinutes()/60;
  return Math.round(goal()*Math.max(0,Math.min(1,(h-7)/15)));
}

function streak(){var s=0;for(var i=on(new Date())>=goal()?0:1;i<400;i++){if(on(ago(i))>=goal())s++;else break}return s}

function render(){
  var g=goal(),n=on(new Date()),p=pace(),T=times()[K.dayKey()]||[];
  var week=[],labels=[];for(var i=6;i>=0;i--){week.push(on(ago(i)));labels.push(i===0?'Today':DAYS[ago(i).getDay()])}
  var logged=week.filter(function(v){return v>0}),avg=logged.length?logged.reduce(function(a,b){return a+b},0)/logged.length:0;
  var hit=week.filter(function(v){return v>=g}).length,best=Math.max.apply(null,week);
  var behind=p-n,paceLine=n>=g?'Done for today. Anything more is a bonus.':behind>0?'About '+behind+' behind pace. A glass now catches you up.':'On pace for '+g+' today.';

  // Last 28 days as dots, oldest first, aligned to weekdays.
  var cells='',start=ago(27);for(var j=0;j<(start.getDay()+6)%7;j++)cells+='<i class="future" aria-hidden="true"></i>';
  for(var d=27;d>=0;d--){var v=on(ago(d)),pc=Math.min(1,v/g);cells+='<i class="'+(v>=g?'full':'')+'" style="--p:'+pc.toFixed(2)+'" title="'+K.esc(K.dayKey(ago(d))+': '+v+' glasses')+'"></i>'}

  document.getElementById('app').innerHTML=
    '<section class="k-card k-hero">'
      +'<div class="k-head" style="width:100%"><span class="k-cat">'+K.icon('drop')+'Water</span><span class="k-time">'+(T.length?'last '+T[T.length-1]:'nothing yet today')+'</span></div>'
      +'<div class="k-ringbox">'+K.ring(n/g,{size:220,label:n+' of '+g+' glasses'})
        +'<div class="k-in"><div class="k-big">'+n+'<small>/ '+g+'</small></div><div class="k-sub">glasses · '+liters(n)+'</div></div></div>'
      +'<p class="k-sub" style="margin:0">'+K.icon(n>=g?'check':'clock','')+' '+paceLine+'</p>'
    +'</section>'
    +'<div class="quick">'
      +'<button class="k-btn" data-add="1">'+K.icon('plus')+'Glass<small>'+ml()+' ml</small></button>'
      +'<button class="k-btn k-soft" data-add="2">'+K.icon('plus')+'Bottle<small>'+(ml()*2)+' ml</small></button>'
      +'<button class="k-btn k-ghost" data-add="-1" '+(n?'':'disabled')+' aria-label="Take one glass away">'+K.icon('minus')+'Undo<small>one glass</small></button>'
    +'</div>'
    +(T.length?'<div class="k-card"><div class="k-label" style="margin-bottom:8px">Today, glass by glass</div><div class="times">'+T.map(function(t){return '<span class="k-tag">'+K.icon('drop','')+t+'</span>'}).join('')+'</div></div>':'')
    +'<h2 class="k-title">This week<span class="k-label">goal '+g+' a day</span></h2>'
    +'<section class="k-card">'+K.bars(week,{labels:labels,goal:g,now:6,height:150,label:'Glasses per day this week'})+'</section>'
    +'<div class="k-grid k-3">'
      +'<div class="k-stat"><div class="k-label">Daily average</div><div class="k-mid">'+K.fmt(avg,1)+'</div><div class="k-sub">glasses, days you logged</div></div>'
      +'<div class="k-stat"><div class="k-label">Goal days</div><div class="k-mid">'+hit+'<small>/7</small></div><div class="k-sub">best day '+best+'</div></div>'
      +'<div class="k-stat"><div class="k-label">Streak</div><div class="k-mid">'+streak()+'</div><div class="k-sub">days in a row at goal</div></div>'
    +'</div>'
    +'<h2 class="k-title">Last four weeks<span class="k-label">ringed = goal hit</span></h2>'
    +'<section class="k-card"><div class="month">'+['M','T','W','T','F','S','S'].map(function(x){return '<b>'+x+'</b>'}).join('')+cells+'</div></section>'
    +'<h2 class="k-title">Settings</h2>'
    +'<div class="k-list">'
      +'<button class="k-row" data-set="goal"><span class="k-ico">'+K.icon('target')+'</span><span class="k-main"><b>Daily goal</b><span>How many glasses count as a full day</span></span><span class="k-end">'+g+'<small>glasses</small></span>'+K.icon('chev','k-chev')+'</button>'
      +'<button class="k-row" data-set="ml"><span class="k-ico">'+K.icon('cup')+'</span><span class="k-main"><b>Glass size</b><span>Used for litres and the bottle button</span></span><span class="k-end">'+ml()+'<small>ml</small></span>'+K.icon('chev','k-chev')+'</button>'
    +'</div>'
    +'<p class="k-note">Feeds your Peak score. The mentor watches how water moves with training and sleep.</p>';
}

function settings(which){
  if(which==='goal'){
    var v=goal();
    K.sheet('Daily goal','<div class="k-stepper"><button class="k-round" data-g="-1" aria-label="One fewer">−</button><div class="k-val"><div class="k-big" id="gv">'+v+'</div><div class="k-sub">glasses a day</div></div><button class="k-round" data-g="1" aria-label="One more">+</button></div><p class="k-note">Most adults do well on 6 to 10 glasses. More on training days.</p><button class="k-btn k-wide" data-k-save>Save goal</button>',function(el,close){
      el.addEventListener('click',function(e){
        var b=e.target.closest('[data-g]');if(b){v=Math.max(1,Math.min(30,v+Number(b.getAttribute('data-g'))));el.querySelector('#gv').textContent=v}
        if(e.target.closest('[data-k-save]')){store.goal=v;persist();close();render()}
      });
    });
  }else{
    var sizes=[200,250,330,500];
    K.sheet('Glass size','<div class="k-chips">'+sizes.map(function(s){return '<button class="k-chip" aria-pressed="'+(s===ml())+'" data-ml="'+s+'">'+s+' ml</button>'}).join('')+'</div><p class="k-note">A bottle is two glasses.</p>',function(el,close){
      el.addEventListener('click',function(e){var b=e.target.closest('[data-ml]');if(b){store.glassMl=Number(b.getAttribute('data-ml'));persist();close();render()}});
    });
  }
}

document.addEventListener('click',function(e){
  var a=e.target.closest('[data-add]');if(a&&!a.disabled){add(Number(a.getAttribute('data-add')));return}
  var s=e.target.closest('[data-set]');if(s)settings(s.getAttribute('data-set'));
});

(async function(){
  try{var d=await window.Vitality.load();store=(d&&typeof d==='object'&&!Array.isArray(d))?d:{}}
  catch(e){store={};K.toast('Could not load your water log: '+(e&&e.message||e))}
  render();
})();
</script>
</body>
</html>
