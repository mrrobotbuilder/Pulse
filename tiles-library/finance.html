<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance</title>
<!--
  Finance: what you own, what comes in, what leaves. Built on the tile kit
  (lib/tiles/tileKit.ts). Sealed: no network; saves through window.Vitality.
  Stock prices come through the host bridge (window.Vitality.stock, the owner's
  own Finnhub key); without a key you type the price yourself.
  Saved shape (lib/tiles/tileStats.ts reads accounts, holdings, subs, history, currency):
    { accounts: [{ id, name, balance, kind? }], holdings: [{ id, symbol, shares, price }],
      subs: [{ id, name, amount (a month), cycle?: 'month'|'year', price?, day?, cat? }],
      history: [{ t, value }], tx: [{ id, at, amount, dir: 'in'|'out', cat, note? }],
      budget?: number, currency?: '$'|'€'|'£'|'kr' }
-->
<style>
  .alloc{display:flex;height:14px;border-radius:9px;overflow:hidden;gap:2px;margin-top:6px}
  .alloc i{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--k-muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend b{width:10px;height:10px;border-radius:3px;display:inline-block}
  .neg{color:var(--k-accent)}
  .dir{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .amount{font:700 40px/1 var(--k-display);text-align:center;border:0;background:transparent;width:100%;color:var(--k-text);padding:8px 0}
  .amount:focus-visible{outline:none;box-shadow:inset 0 -2px 0 var(--k-tint)}
  .cats{display:grid;gap:10px}
  .cats div{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center}
  .cats .k-ico{width:32px;height:32px;border-radius:10px}
  .cats .k-ico svg{width:18px;height:18px}
  .cats .bar{height:8px;border-radius:9px;background:color-mix(in srgb,var(--k-text) 8%,transparent);margin-top:5px;overflow:hidden}
  .cats .bar i{display:block;height:100%;border-radius:9px;background:var(--k-tint)}
  .cats b{font-size:14px}
  .cats em{font:700 14px var(--k-display);font-style:normal}
</style>
</head>
<body class="k-hue-green">
<main class="k-page" id="app"></main>
<script>
var K=window.PulseKit;
var store={},view='overview',range='all',fetching={},keyNote=false;
var KINDS=[['cash','Cash & checking','wallet','var(--k-signal)'],['savings','Savings','piggy','color-mix(in srgb,#1E6FD9 76%,var(--k-text))'],['invest','Investments','chart','var(--k-gold)'],['crypto','Crypto','coins','color-mix(in srgb,#5550E0 78%,var(--k-text))'],['debt','Loans & cards','down','var(--k-accent)']];
var CATS=[['food','Food','cup'],['home','Home','calendar'],['transport','Transport','send'],['fun','Fun','star'],['shopping','Shopping','wallet'],['health','Health','heart'],['other','Other','list']];
var INCATS=[['salary','Salary','wallet'],['side','Side income','bolt'],['gift','Gift','star'],['other','Other','list']];
var CUR=['$','€','£','kr'];

function arr(k){if(!Array.isArray(store[k]))store[k]=[];return store[k]}
function num(x){return typeof x==='number'&&isFinite(x)?x:0}
function cur(){return CUR.indexOf(store.currency)>-1?store.currency:'$'}
function money(n,dp){if(n==null||!isFinite(n))return '—';var s=n<0?'−':'',a=Math.abs(n),c=cur(),v=a>=1e6?(a/1e6).toFixed(2)+'M':a.toLocaleString('en-US',{maximumFractionDigits:dp==null?(a>=1000?0:2):dp});return c==='kr'?s+v+' kr':s+c+v}
function kind(a){var k=a.kind||'cash';for(var i=0;i<KINDS.length;i++)if(KINDS[i][0]===k)return KINDS[i];return KINDS[0]}
function hv(h){return num(h.shares)*num(h.price)}
function netWorth(){var s=0;arr('accounts').forEach(function(a){s+=num(a.balance)});arr('holdings').forEach(function(h){s+=hv(h)});return s}
function burn(){return arr('subs').reduce(function(s,x){return s+num(x.amount)},0)}
function uid(p){return p+Math.random().toString(36).slice(2,8)}
function parse(v){var n=Number(String(v==null?'':v).replace(/[^0-9.,\-]/g,'').replace(',','.'));return isFinite(n)?n:NaN}
function persist(){return Promise.resolve(window.Vitality.save(store)).catch(function(e){K.toast('Could not save: '+(e&&e.message||e))})}
function snapshot(){var v=netWorth(),h=arr('history'),now=Date.now(),p=h[h.length-1];if(p&&p.value===v)return;if(p&&now-p.t<120000){p.t=now;p.value=v}else h.push({t:now,value:v})}
function monthKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthTx(){var m=monthKey();return arr('tx').filter(function(t){return typeof t.at==='number'&&monthKey(new Date(t.at))===m})}

function delta(fromT){var h=arr('history').filter(function(p){return typeof p.value==='number'});if(h.length<2)return null;var base=h[0];for(var i=0;i<h.length;i++)if(h[i].t>=fromT){base=h[Math.max(0,i-1)];break}return h[h.length-1].value-base.value}
function chg(d,label){if(d==null)return '<span class="k-sub">'+label+': not enough history yet</span>';return '<span class="'+(d>=0?'k-up':'k-down')+'">'+(d>=0?'▲ ':'▼ ')+money(Math.abs(d))+'</span> <span class="k-sub">'+label+'</span>'}

function viewOverview(){
  var accts=arr('accounts'),holds=arr('holdings'),any=accts.length||holds.length,nw=netWorth();
  var since={m1:Date.now()-30*864e5,m3:Date.now()-90*864e5,all:0}[range];
  var h=arr('history').filter(function(p){return typeof p.value==='number'&&p.t>=since});
  var by={};accts.forEach(function(a){var k=kind(a)[0];by[k]=(by[k]||0)+num(a.balance)});var st=holds.reduce(function(s,x){return s+hv(x)},0);if(st)by.invest=(by.invest||0)+st;
  var pos=KINDS.filter(function(k){return k[0]!=='debt'&&by[k[0]]>0}),tot=pos.reduce(function(s,k){return s+by[k[0]]},0);
  var tx=monthTx(),inn=tx.filter(function(t){return t.dir==='in'}).reduce(function(s,t){return s+num(t.amount)},0),out=tx.filter(function(t){return t.dir!=='in'}).reduce(function(s,t){return s+num(t.amount)},0)+burn();
  return '<section class="k-card"><div class="k-head"><span class="k-cat">'+K.icon('wallet')+'Net worth</span><span class="k-time">'+(any?accts.length+holds.length+' places':'start below')+'</span></div>'
      +'<div class="k-big'+(nw<0?' neg':'')+'">'+(any?money(nw):'—')+'</div>'
      +'<div style="margin-top:6px">'+chg(delta(Date.now()-30*864e5),'last 30 days')+'</div>'
      +'<div style="margin-top:14px">'+K.line(h.map(function(p){return p.value}),{height:140,label:'Net worth over time',labels:h.length?[new Date(h[0].t).toLocaleDateString(undefined,{month:'short',day:'numeric'}),'Now']:null,empty:any?'Your line draws itself as balances change from day to day.':'Add an account and your net-worth line draws itself as balances change.'})+'</div>'
      +'<div class="k-seg" role="tablist" aria-label="Range" style="margin-top:10px">'+[['m1','1M'],['m3','3M'],['all','All']].map(function(r){return '<button role="tab" data-range="'+r[0]+'" aria-selected="'+(range===r[0])+'">'+r[1]+'</button>'}).join('')+'</div></section>'
    +(tot?'<section class="k-card"><div class="k-label">Where it sits</div><div class="alloc">'+pos.map(function(k){return '<i style="flex:'+by[k[0]]+';background:'+k[3]+'" title="'+k[1]+'"></i>'}).join('')+'</div><div class="legend">'+pos.map(function(k){return '<span><b style="background:'+k[3]+'"></b>'+k[1]+' '+Math.round(by[k[0]]/tot*100)+'%</span>'}).join('')+(by.debt?'<span><b style="background:var(--k-accent)"></b>Debt '+money(by.debt)+'</span>':'')+'</div></section>':'')
    +'<div class="k-grid k-3"><div class="k-stat"><div class="k-label">In this month</div><div class="k-mid">'+money(inn)+'</div><div class="k-sub">logged income</div></div><div class="k-stat"><div class="k-label">Out this month</div><div class="k-mid">'+money(out)+'</div><div class="k-sub">spending + subs</div></div><div class="k-stat"><div class="k-label">Saved</div><div class="k-mid'+(inn-out<0?' neg':'')+'">'+(inn?Math.round((inn-out)/inn*100)+'<small>%</small>':'—')+'</div><div class="k-sub">'+(inn?money(inn-out)+' kept':'log income to see it')+'</div></div></div>'
    +'<h2 class="k-title">Accounts<button data-addacct>+ Add</button></h2>'
    +(accts.length?'<div class="k-list">'+accts.map(function(a){var k=kind(a);return '<button class="k-row" data-acct="'+a.id+'"><span class="k-ico" style="color:'+k[3]+';background:color-mix(in srgb,'+k[3]+' 14%,transparent)">'+K.icon(k[2])+'</span><span class="k-main"><b>'+K.esc(a.name)+'</b><span>'+k[1]+'</span></span><span class="k-end'+(num(a.balance)<0||k[0]==='debt'?' neg':'')+'">'+money(num(a.balance))+'</span>'+K.icon('chev','k-chev')+'</button>'}).join('')+'</div>'
      :'<div class="k-card k-empty">'+K.icon('wallet')+'<b>No accounts yet</b><span>Add your checking, savings or a card. Balances only, no bank login.</span><button class="k-btn" data-addacct>'+K.icon('plus')+'Add an account</button></div>')
    +'<div class="k-list"><button class="k-row" data-currency><span class="k-ico">'+K.icon('coins')+'</span><span class="k-main"><b>Currency</b><span>How amounts are written</span></span><span class="k-end">'+K.esc(cur())+'</span>'+K.icon('chev','k-chev')+'</button></div>';
}

function viewFlow(){
  var tx=monthTx(),outs=tx.filter(function(t){return t.dir!=='in'}),ins=tx.filter(function(t){return t.dir==='in'});
  var spent=outs.reduce(function(s,t){return s+num(t.amount)},0),inn=ins.reduce(function(s,t){return s+num(t.amount)},0),bud=num(store.budget);
  var by={};outs.forEach(function(t){by[t.cat||'other']=(by[t.cat||'other']||0)+num(t.amount)});var mx=Math.max.apply(null,Object.keys(by).map(function(k){return by[k]}).concat([1]));
  var month=new Date().toLocaleDateString(undefined,{month:'long'}),day=new Date().getDate(),days=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  var recent=arr('tx').slice().sort(function(a,b){return b.at-a.at}).slice(0,25);
  return '<section class="k-card k-hero"><div class="k-head" style="width:100%"><span class="k-cat">'+K.icon('chart')+month+'</span><span class="k-time">day '+day+' of '+days+'</span></div>'
      +'<div class="k-ringbox">'+K.rings([{value:bud?spent/bud:0,color:'var(--k-accent)'},{value:bud?(day/days):0,color:'color-mix(in srgb,var(--k-text) 40%,transparent)'}],{size:200,label:'Spent '+money(spent)+(bud?' of '+money(bud):'')})
      +'<div class="k-in"><div class="k-mid">'+money(spent)+'</div><div class="k-sub">'+(bud?'of '+money(bud)+' budget':'spent')+'</div></div></div>'
      +'<div class="k-sub">'+(bud?(spent>bud?'Over budget by '+money(spent-bud)+'.':spent/bud>day/days+.08?'Spending faster than the month is passing.':'On track: '+money(bud-spent)+' left, about '+money((bud-spent)/Math.max(1,days-day+1))+' a day.'):'Set a monthly budget to see your pace. Outer ring = spent, inner ring = month gone.')+'</div>'
      +'<div class="k-row-btns" style="width:100%;margin-top:6px"><button class="k-btn" data-tx="out">'+K.icon('minus')+'Spent'+'</button><button class="k-btn k-soft" data-tx="in">'+K.icon('plus')+'Got paid</button></div></section>'
    +'<div class="k-grid k-3"><div class="k-stat"><div class="k-label">In</div><div class="k-mid k-up">'+money(inn)+'</div></div><div class="k-stat"><div class="k-label">Out</div><div class="k-mid">'+money(spent)+'</div><div class="k-sub">+ '+money(burn())+' subs</div></div><div class="k-stat"><div class="k-label">Net</div><div class="k-mid'+(inn-spent-burn()<0?' neg':'')+'">'+money(inn-spent-burn())+'</div></div></div>'
    +'<h2 class="k-title">By category<span class="k-label">this month</span></h2>'
    +'<section class="k-card">'+(Object.keys(by).length?'<div class="cats">'+CATS.filter(function(c){return by[c[0]]}).sort(function(a,b){return by[b[0]]-by[a[0]]}).map(function(c){return '<div><span class="k-ico">'+K.icon(c[2])+'</span><span><b>'+c[1]+'</b><div class="bar"><i style="width:'+(by[c[0]]/mx*100).toFixed(0)+'%"></i></div></span><em>'+money(by[c[0]])+'</em></div>'}).join('')+'</div>':'<p class="k-sub" style="margin:0">Log what you spend and it groups itself here.</p>')+'</section>'
    +'<h2 class="k-title">Recent</h2>'
    +(recent.length?'<div class="k-list">'+recent.map(function(t){var c=(t.dir==='in'?INCATS:CATS).filter(function(x){return x[0]===t.cat})[0]||CATS[6];return '<div class="k-row"><span class="k-ico">'+K.icon(c[2])+'</span><span class="k-main"><b>'+K.esc(t.note||c[1])+'</b><span>'+c[1]+' · '+new Date(t.at).toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</span></span><span class="k-end '+(t.dir==='in'?'k-up':'')+'">'+(t.dir==='in'?'+':'−')+money(num(t.amount))+'</span><button class="k-x" data-deltx="'+t.id+'" aria-label="Delete">'+K.icon('trash')+'</button></div>'}).join('')+'</div>'
      :'<div class="k-card k-empty">'+K.icon('list')+'<b>Nothing logged</b><span>Tap Spent or Got paid. It takes five seconds.</span></div>')
    +'<div class="k-list"><button class="k-row" data-budget><span class="k-ico">'+K.icon('target')+'</span><span class="k-main"><b>Monthly budget</b><span>For spending, not subscriptions</span></span><span class="k-end">'+(bud?money(bud):'not set')+'</span>'+K.icon('chev','k-chev')+'</button></div>';
}

function nextRenew(s){if(!s.day)return '';var d=new Date(),n=new Date(d.getFullYear(),d.getMonth(),s.day);if(n<new Date(d.getFullYear(),d.getMonth(),d.getDate()))n.setMonth(n.getMonth()+1);var dd=Math.round((n-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);return dd===0?'renews today':dd===1?'renews tomorrow':'renews in '+dd+' days'}
function viewSubs(){
  var list=arr('subs').slice().sort(function(a,b){return num(b.amount)-num(a.amount)}),m=burn();
  return '<section class="k-card k-hero"><div class="k-head" style="width:100%"><span class="k-cat">'+K.icon('calendar')+'Subscriptions</span><span class="k-time">'+list.length+' active</span></div><div class="k-big">'+(list.length?money(m):'—')+'<small>/ month</small></div><div class="k-sub">'+(list.length?money(m*12)+' a year · '+money(m/30,2)+' a day':'Add what renews every month or year.')+'</div></section>'
    +'<button class="k-btn k-wide" data-addsub>'+K.icon('plus')+'Add subscription</button>'
    +(list.length?'<div class="k-list">'+list.map(function(s){return '<button class="k-row" data-sub="'+s.id+'"><span class="k-ico">'+K.esc((s.name||'?').charAt(0).toUpperCase())+'</span><span class="k-main"><b>'+K.esc(s.name)+'</b><span>'+(s.cycle==='year'?money(num(s.price))+' a year':'monthly')+(s.day?' · '+nextRenew(s):'')+'</span></span><span class="k-end">'+money(num(s.amount))+'<small>a month</small></span>'+K.icon('chev','k-chev')+'</button>'}).join('')+'</div>':'')
    +(list.length>2?'<p class="k-note">Cancelling the most expensive one saves '+money(num(list[0].amount)*12)+' a year.</p>':'');
}

function viewStocks(){
  var hs=arr('holdings'),tot=hs.reduce(function(s,h){return s+hv(h)},0);
  return '<section class="k-card"><div class="k-head"><span class="k-cat">'+K.icon('chart')+'Holdings</span><span class="k-time">'+hs.length+' position'+(hs.length===1?'':'s')+'</span></div><div class="k-big">'+(hs.length?money(tot):'—')+'</div></section>'
    +'<button class="k-btn k-wide" data-addstock>'+K.icon('plus')+'Add a stock</button>'
    +(hs.length?'<div class="k-list">'+hs.map(function(h){var p=typeof h.price==='number'?h.price:null;return '<button class="k-row" data-stock="'+h.id+'"><span class="k-ico" style="font:700 12px var(--k-mono)">'+K.esc(String(h.symbol||'?').slice(0,4))+'</span><span class="k-main"><b>'+K.esc(h.symbol)+'</b><span>'+num(h.shares)+' shares'+(fetching[h.id]?' · pricing…':p!=null?' @ '+money(p,2):' · no price yet')+'</span></span><span class="k-end">'+(p!=null?money(hv(h)):'—')+'</span>'+K.icon('chev','k-chev')+'</button>'}).join('')+'</div>':'')
    +(keyNote?'<p class="k-note">Live prices need your own free Finnhub key in <b>.env.local</b>; ask your mentor to set it up. Until then, tap a stock to type its price.</p>':'<p class="k-note">Prices refresh when you open this tile.</p>');
}

function render(){
  document.getElementById('app').innerHTML='<div class="k-seg" role="tablist" aria-label="Finance">'+[['overview','Overview'],['flow','In & out'],['subs','Subscriptions'],['stocks','Stocks']].map(function(t){return '<button role="tab" data-view="'+t[0]+'" aria-selected="'+(view===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>'
    +(view==='overview'?viewOverview():view==='flow'?viewFlow():view==='subs'?viewSubs():viewStocks());
}

async function refreshStock(h){
  var V=window.Vitality||{};if(!h.symbol||!V.stock||fetching[h.id])return;
  fetching[h.id]=1;render();
  try{var price=await V.stock(h.symbol);if(typeof price==='number'&&price>0){h.price=price;snapshot();persist()}}
  catch(e){if(String(e&&e.message||'')==='no_key')keyNote=true}
  finally{delete fetching[h.id];render()}
}

/* ── the editing sheets ── */
function acctSheet(a){
  var isNew=!a;a=a||{name:'',balance:'',kind:'cash'};var k=a.kind||'cash';
  K.sheet(isNew?'Add an account':'Edit account','<label class="k-field"><span>Name</span><input class="k-input" id="an" maxlength="40" value="'+K.esc(a.name)+'" placeholder="e.g. Everyday account"></label><div class="k-field"><span>Type</span><div class="k-chips">'+KINDS.map(function(x){return '<button type="button" class="k-chip" data-kind="'+x[0]+'" aria-pressed="'+(k===x[0])+'">'+x[1]+'</button>'}).join('')+'</div></div><label class="k-field"><span>Balance '+(k==='debt'?'(what you owe, as a minus)':'')+'</span><input class="k-input" id="ab" inputmode="decimal" value="'+(a.balance===''?'':num(a.balance))+'" placeholder="0"></label><div class="k-row-btns">'+(isNew?'':'<button class="k-btn k-danger" data-rm>Delete</button>')+'<button class="k-btn" data-ok>'+(isNew?'Add account':'Save')+'</button></div>',function(el,close){
    el.addEventListener('click',function(e){var b=e.target.closest('[data-kind]');if(b){k=b.getAttribute('data-kind');el.querySelectorAll('[data-kind]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})}});
    el.querySelector('[data-ok]').onclick=function(){var nm=el.querySelector('#an').value.trim(),bal=parse(el.querySelector('#ab').value);if(!nm){el.querySelector('#an').focus();return}if(isNaN(bal))bal=0;if(k==='debt'&&bal>0)bal=-bal;
      if(isNew)arr('accounts').push({id:uid('a'),name:nm.slice(0,40),balance:bal,kind:k});else{a.name=nm.slice(0,40);a.balance=bal;a.kind=k}snapshot();persist();close();render()};
    var rm=el.querySelector('[data-rm]');if(rm)rm.onclick=function(){store.accounts=arr('accounts').filter(function(x){return x!==a});snapshot();persist();close();render()};
  });
}
function txSheet(dir){
  var cats=dir==='in'?INCATS:CATS,cat=cats[0][0];
  K.sheet(dir==='in'?'Money in':'Money out','<input class="amount" id="ta" inputmode="decimal" placeholder="'+(cur()==='kr'?'0 kr':cur()+'0')+'" aria-label="Amount"><div class="k-chips">'+cats.map(function(c,i){return '<button type="button" class="k-chip" data-cat="'+c[0]+'" aria-pressed="'+(i===0)+'">'+K.icon(c[2])+c[1]+'</button>'}).join('')+'</div><label class="k-field"><span>Note (optional)</span><input class="k-input" id="tn" maxlength="60" placeholder="'+(dir==='in'?'e.g. October salary':'e.g. groceries at ICA')+'"></label><button class="k-btn k-wide" data-ok>'+K.icon('check')+'Save</button>',function(el,close){
    el.addEventListener('click',function(e){var b=e.target.closest('[data-cat]');if(b){cat=b.getAttribute('data-cat');el.querySelectorAll('[data-cat]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})}});
    el.querySelector('[data-ok]').onclick=function(){var v=parse(el.querySelector('#ta').value);if(!(v>0)){el.querySelector('#ta').focus();K.toast('Type an amount first.');return}arr('tx').push({id:uid('t'),at:Date.now(),amount:v,dir:dir,cat:cat,note:el.querySelector('#tn').value.trim().slice(0,60)||undefined});persist();close();render()};
  });
}
function subSheet(s){
  var isNew=!s;s=s||{name:'',amount:'',cycle:'month'};var cyc=s.cycle||'month';
  K.sheet(isNew?'Add subscription':'Edit subscription','<label class="k-field"><span>Name</span><input class="k-input" id="sn" maxlength="40" value="'+K.esc(s.name)+'" placeholder="e.g. Spotify"></label><div class="k-seg" role="tablist"><button type="button" role="tab" data-cyc="month" aria-selected="'+(cyc==='month')+'">Monthly</button><button type="button" role="tab" data-cyc="year" aria-selected="'+(cyc==='year')+'">Yearly</button></div><label class="k-field"><span id="sl">Price '+(cyc==='year'?'a year':'a month')+'</span><input class="k-input" id="sp" inputmode="decimal" value="'+(isNew?'':(cyc==='year'?num(s.price):num(s.amount)))+'" placeholder="0"></label><label class="k-field"><span>Renews on day of month (optional)</span><input class="k-input" id="sd" inputmode="numeric" value="'+(s.day||'')+'" placeholder="1–31"></label><div class="k-row-btns">'+(isNew?'':'<button class="k-btn k-danger" data-rm>Delete</button>')+'<button class="k-btn" data-ok>'+(isNew?'Add':'Save')+'</button></div>',function(el,close){
    el.addEventListener('click',function(e){var b=e.target.closest('[data-cyc]');if(b){cyc=b.getAttribute('data-cyc');el.querySelectorAll('[data-cyc]').forEach(function(x){x.setAttribute('aria-selected',String(x===b))});el.querySelector('#sl').textContent='Price '+(cyc==='year'?'a year':'a month')}});
    el.querySelector('[data-ok]').onclick=function(){var nm=el.querySelector('#sn').value.trim(),p=parse(el.querySelector('#sp').value),d=parseInt(el.querySelector('#sd').value,10);if(!nm){el.querySelector('#sn').focus();return}if(!(p>=0))p=0;
      var o={name:nm.slice(0,40),cycle:cyc,amount:cyc==='year'?Math.round(p/12*100)/100:p,day:d>=1&&d<=31?d:undefined};if(cyc==='year')o.price=p;
      if(isNew)arr('subs').push(Object.assign({id:uid('s')},o));else{Object.assign(s,o);if(cyc!=='year')delete s.price}persist();close();render()};
    var rm=el.querySelector('[data-rm]');if(rm)rm.onclick=function(){store.subs=arr('subs').filter(function(x){return x!==s});persist();close();render()};
  });
}
function stockSheet(h){
  var isNew=!h;h=h||{symbol:'',shares:'',price:null};
  K.sheet(isNew?'Add a stock':h.symbol,'<label class="k-field"><span>Ticker</span><input class="k-input" id="ss" maxlength="12" value="'+K.esc(h.symbol)+'" placeholder="e.g. AAPL" style="text-transform:uppercase"></label><label class="k-field"><span>Shares</span><input class="k-input" id="sh" inputmode="decimal" value="'+(h.shares===''?'':num(h.shares))+'" placeholder="0"></label><label class="k-field"><span>Price per share (leave empty to fetch it live)</span><input class="k-input" id="spx" inputmode="decimal" value="'+(typeof h.price==='number'?h.price:'')+'" placeholder="auto"></label><div class="k-row-btns">'+(isNew?'':'<button class="k-btn k-danger" data-rm>Delete</button>')+'<button class="k-btn" data-ok>'+(isNew?'Add':'Save')+'</button></div>',function(el,close){
    el.querySelector('[data-ok]').onclick=function(){var sym=el.querySelector('#ss').value.trim().toUpperCase(),sh=parse(el.querySelector('#sh').value),px=parse(el.querySelector('#spx').value);if(!sym){el.querySelector('#ss').focus();return}
      var o={symbol:sym.slice(0,12),shares:sh>=0?sh:0,price:px>0?px:(h.price||null)};var t=h;if(isNew){t=Object.assign({id:uid('h')},o);arr('holdings').push(t)}else Object.assign(h,o);snapshot();persist();close();render();if(!(px>0))refreshStock(t)};
    var rm=el.querySelector('[data-rm]');if(rm)rm.onclick=function(){store.holdings=arr('holdings').filter(function(x){return x!==h});snapshot();persist();close();render()};
  });
}

document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.closest('.k-sheet'))return;var a=function(n){return b.getAttribute(n)};
  if(a('data-view')){view=a('data-view');render();return}
  if(a('data-range')){range=a('data-range');render();return}
  if(b.hasAttribute('data-addacct')){acctSheet(null);return}
  if(a('data-acct')){acctSheet(arr('accounts').filter(function(x){return x.id===a('data-acct')})[0]);return}
  if(a('data-tx')){txSheet(a('data-tx'));return}
  if(a('data-deltx')){store.tx=arr('tx').filter(function(t){return t.id!==a('data-deltx')});persist();render();return}
  if(b.hasAttribute('data-addsub')){subSheet(null);return}
  if(a('data-sub')){subSheet(arr('subs').filter(function(x){return x.id===a('data-sub')})[0]);return}
  if(b.hasAttribute('data-addstock')){stockSheet(null);return}
  if(a('data-stock')){stockSheet(arr('holdings').filter(function(x){return x.id===a('data-stock')})[0]);return}
  if(b.hasAttribute('data-budget')){K.sheet('Monthly budget','<input class="amount" id="bv" inputmode="decimal" value="'+(num(store.budget)||'')+'" placeholder="'+(cur()==='kr'?'0 kr':cur()+'0')+'" aria-label="Budget"><p class="k-note">What you plan to spend in a month, not counting subscriptions.</p><button class="k-btn k-wide" data-ok>Save budget</button>',function(el,close){el.querySelector('[data-ok]').onclick=function(){var v=parse(el.querySelector('#bv').value);store.budget=v>0?v:undefined;persist();close();render()}});return}
  if(b.hasAttribute('data-currency')){K.sheet('Currency','<div class="k-chips">'+CUR.map(function(c){return '<button class="k-chip" data-cur="'+c+'" aria-pressed="'+(cur()===c)+'">'+c+'</button>'}).join('')+'</div><p class="k-note">Only changes how amounts are written; nothing is converted.</p>',function(el,close){el.addEventListener('click',function(ev){var x=ev.target.closest('[data-cur]');if(x){store.currency=x.getAttribute('data-cur');persist();close();render()}})});return}
});

(async function(){
  try{var d=await window.Vitality.load();store=(d&&typeof d==='object'&&!Array.isArray(d))?d:{}}
  catch(e){store={};K.toast('Could not load your finances: '+(e&&e.message||e))}
  render();
  var hs=arr('holdings').filter(function(h){return h.symbol});
  for(var i=0;i<hs.length;i++){await refreshStock(hs[i]);await new Promise(function(r){setTimeout(r,1200)})}
})();
</script>
</body>
</html>
