<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peak</title>
<!--
  Peak: your predicted energy, hour by hour. Built on the tile kit
  (lib/tiles/tileKit.ts). Sealed: no network; saves through window.Vitality and
  reads today's recovery from the Vitals tile (window.Vitality.read('vitals')).
  Saved shape (the mentor may file logs, events and whoop through save_data):
    { weightKg, whoop: { recovery?, sleepScore? },
      logs: [{ key, dose, tolerance, takenHour, day? }],      caffeine
      events: [{ title, startHour, endHour, tone, day? }],     today's plan
      taps: [{ id, hour, value: -100..100, day? }] }           how you felt
  Entries without `day` are older ones and count every day, as they always did.
-->
<style>
  .curve{position:relative;touch-action:pan-y}
  .curve svg{display:block;width:100%;height:220px;overflow:visible}
  .curve .tip{position:absolute;top:0;transform:translateX(-50%);padding:4px 8px;border-radius:8px;background:var(--k-text);color:var(--k-surface);font:700 12px var(--k-body);white-space:nowrap;pointer-events:none}
  .hours{display:flex;justify-content:space-between;font:500 10.5px var(--k-mono);color:var(--k-muted);margin-top:4px}
  .feelrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .feelrow button{min-height:64px;border-radius:12px;border:1px solid var(--k-line);background:var(--k-surface);display:grid;place-items:center;gap:2px;font:600 12.5px var(--k-body);color:var(--k-text)}
  .feelrow button i{width:20px;height:20px;border-radius:50%;background:var(--c);display:block}
  .plan{position:relative;height:40px;border-radius:10px;background:color-mix(in srgb,var(--k-text) 5%,transparent);overflow:hidden;margin-top:10px}
  .plan span{position:absolute;top:4px;bottom:4px;border-radius:7px;padding:0 6px;font:600 11px/32px var(--k-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--k-text)}
  .plan .now{position:absolute;top:0;bottom:0;width:2px;background:var(--k-text)}
  .win{display:flex;align-items:center;gap:12px}
</style>
</head>
<body class="k-hue-gold">
<main class="k-page" id="app"></main>
<script>
var K=window.PulseKit;

/* ═══ the curve maths (ported from curve.ts; unchanged) ═══ */
var BASELINE=[18,12,10,14,16,22,30,42,55,68,75,70,62,50,44,48,56,64,72,84,92,88,64,38,18];
var SUBSTANCES={
  coffee:{key:'coffee',name:'Coffee',defaultDose:95,unit:'mg',amplitude:16,onsetHours:0.25,peakHours:0.75,halfLifeHours:5.0},
  espresso:{key:'espresso',name:'Espresso',defaultDose:75,unit:'mg',amplitude:14,onsetHours:0.2,peakHours:0.5,halfLifeHours:5.0},
  tea:{key:'tea',name:'Tea',defaultDose:47,unit:'mg',amplitude:8,onsetHours:0.3,peakHours:0.8,halfLifeHours:5.0},
  energy:{key:'energy',name:'Energy drink',defaultDose:80,unit:'mg',amplitude:14,onsetHours:0.25,peakHours:0.75,halfLifeHours:5.0},
  preworkout:{key:'preworkout',name:'Pre-workout',defaultDose:200,unit:'mg',amplitude:22,onsetHours:0.3,peakHours:0.75,halfLifeHours:5.0}
};
function effectiveAmplitude(log,weightKg){var def=SUBSTANCES[log.key];if(!def)return 0;var tol=typeof log.tolerance==='number'?log.tolerance:5;return def.amplitude*(log.dose/def.defaultDose)*(75/Math.max(40,weightKg))*((11-tol)/6)}
function contributionAt(h,log,w){var def=SUBSTANCES[log.key];if(!def)return 0;var dt=h-log.takenHour;if(dt<def.onsetHours)return 0;var amp=effectiveAmplitude(log,w);if(dt<def.peakHours)return amp*(dt-def.onsetHours)/(def.peakHours-def.onsetHours);return amp*Math.pow(0.5,(dt-def.peakHours)/def.halfLifeHours)}
function whoopMultiplier(wh){var m=new Array(25).fill(1),touched=false,h;
  if(typeof wh.recovery==='number'){var r=Math.max(0,Math.min(100,wh.recovery)),k=0.55+(r/100)*0.65;for(h=0;h<25;h++)m[h]*=k;touched=true}
  if(typeof wh.sleepScore==='number'&&wh.sleepScore<70){var cap=0.65+(Math.max(0,wh.sleepScore)/70)*0.35;for(h=0;h<25;h++)m[h]=Math.min(m[h],cap);touched=true}
  return touched?m:null}
function curve(){var wm=whoopMultiplier(D.whoop),logs=today(D.logs);return BASELINE.map(function(b,h){var pre=b;logs.forEach(function(l){pre+=contributionAt(h,l,D.weightKg)});return Math.max(0,Math.min(100,pre*(wm?wm[h]:1)))})}
function tierFor(s){if(s>=80)return 'Peak';if(s>=65)return 'Solid';if(s>=50)return 'Tired';if(s>=35)return 'Low';return 'Drained'}
function at(c,h){if(h<=0)return c[0];if(h>=24)return c[24];var i=Math.floor(h),f=h-i;return c[i]*(1-f)+c[i+1]*f}
function windows(c,from,th){th=th||70;var out=[],s=null,sum=0,n=0,pk=0;for(var h=from;h<c.length;h++){var v=c[h];if(v>=th){if(s===null){s=h;sum=0;n=0;pk=h}sum+=v;n++;if(v>c[pk])pk=h}else if(s!==null){if(h-s>=1)out.push({start:s,end:h,avg:sum/n,peak:pk});s=null}}if(s!==null)out.push({start:s,end:24,avg:sum/n,peak:pk});return out.sort(function(a,b){return b.avg-a.avg}).slice(0,3)}
/* The Vitals recovery formula, verbatim (vitals.html estRecovery, tileStats.ts). */
function recoveryFromVitals(h){if(!h)return null;if(typeof h.whoopRecovery==='number')return Math.max(1,Math.min(99,Math.round(h.whoopRecovery)));var c=function(x){return Math.max(0,Math.min(1,x))},p=[],w=[];if(typeof h.feel==='number'){p.push(Math.max(0,Math.min(100,h.feel)));w.push(0.6)}if(typeof h.sleepHours==='number'){p.push(c(h.sleepHours/8)*100);w.push(0.4)}if(!p.length)return null;var sw=w.reduce(function(a,b){return a+b},0),s=0;for(var i=0;i<p.length;i++)s+=p[i]*w[i];return Math.max(1,Math.min(99,Math.round(s/sw)))}

/* ═══ data ═══ */
var D={weightKg:75,whoop:{},logs:[],events:[],taps:[]},recSource=null,hover=null;
var TONES={focus:['Deep work','var(--k-gold)'],workout:['Workout','var(--k-accent)'],meeting:['Meeting','color-mix(in srgb,#1E6FD9 76%,var(--k-text))'],rest:['Rest','var(--k-signal)']};
var LEGACY_TONE={mint:'rest',amber:'focus',red:'workout',muted:'meeting'};
var FEELS=[['Drained',-80,'#C2271D'],['Low',-40,'#D9590F'],['OK',0,'#B88A00'],['Good',40,'#3D9A5B'],['Peak',80,'#0B7A4B']];
function today(list){var k=K.dayKey();return (list||[]).filter(function(x){return x&&(!x.day||x.day===k)})}
function nowH(){var d=new Date();return d.getHours()+d.getMinutes()/60}
function hh(h){var H=Math.floor(h),M=Math.round((h-H)*60);if(M===60){H++;M=0}return String(H%24).padStart(2,'0')+':'+String(M).padStart(2,'0')}
function persist(){return Promise.resolve(window.Vitality.save({weightKg:D.weightKg,whoop:D.whoop,logs:D.logs,events:D.events,taps:D.taps})).catch(function(e){K.toast('Could not save: '+(e&&e.message||e))})}
function color(s){return s>=65?'var(--k-signal)':s>=50?'var(--k-gold)':'var(--k-accent)'}

function chart(c){
  var W=600,H=220,top=10,bot=10,ih=H-top-bot,X=function(h){return h/24*W},Y=function(v){return top+(1-v/100)*ih};
  var d='M0 '+Y(c[0]).toFixed(1);for(var i=0;i<c.length-1;i++){var p0=c[i-1]!=null?c[i-1]:c[i],p1=c[i],p2=c[i+1],p3=c[i+2]!=null?c[i+2]:p2;d+=' C'+(X(i)+W/24/3).toFixed(1)+' '+Y(p1+(p2-p0)/6).toFixed(1)+','+(X(i+1)-W/24/3).toFixed(1)+' '+Y(p2-(p3-p1)/6).toFixed(1)+','+X(i+1).toFixed(1)+' '+Y(p2).toFixed(1)}
  var n=nowH(),out='<defs><linearGradient id="pg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--k-tint)" stop-opacity=".35"/><stop offset="1" stop-color="var(--k-tint)" stop-opacity="0"/></linearGradient></defs>';
  windows(c,0).forEach(function(w){out+='<rect x="'+X(w.start).toFixed(1)+'" y="'+top+'" width="'+(X(w.end)-X(w.start)).toFixed(1)+'" height="'+ih+'" fill="var(--k-signal)" opacity=".09" rx="6"/>'});
  [25,50,75].forEach(function(v){out+='<line x1="0" x2="'+W+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--k-hair)" vector-effect="non-scaling-stroke"/>'});
  out+='<path d="'+d+' L'+W+' '+(top+ih)+' L0 '+(top+ih)+'Z" fill="url(#pg)"/><path d="'+d+'" fill="none" stroke="var(--k-tint)" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  out+='<line x1="'+X(n).toFixed(1)+'" x2="'+X(n).toFixed(1)+'" y1="'+top+'" y2="'+(top+ih)+'" stroke="var(--k-text)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/><circle cx="'+X(n).toFixed(1)+'" cy="'+Y(at(c,n)).toFixed(1)+'" r="6" fill="var(--k-surface)" stroke="var(--k-text)" stroke-width="3" vector-effect="non-scaling-stroke"/>';
  today(D.taps).forEach(function(t){var f=FEELS.reduce(function(a,b){return Math.abs(b[1]-t.value)<Math.abs(a[1]-t.value)?b:a});out+='<circle cx="'+X(t.hour).toFixed(1)+'" cy="'+Y(Math.max(2,Math.min(98,50+t.value/2))).toFixed(1)+'" r="5" fill="'+f[2]+'" stroke="var(--k-surface)" stroke-width="2" vector-effect="non-scaling-stroke"><title>You felt '+f[0]+' at '+hh(t.hour)+'</title></circle>'});
  if(hover!=null)out+='<line x1="'+X(hover).toFixed(1)+'" x2="'+X(hover).toFixed(1)+'" y1="'+top+'" y2="'+(top+ih)+'" stroke="var(--k-tint)" vector-effect="non-scaling-stroke"/><circle cx="'+X(hover).toFixed(1)+'" cy="'+Y(at(c,hover)).toFixed(1)+'" r="5" fill="var(--k-tint)" vector-effect="non-scaling-stroke"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Predicted energy across the day">'+out+'</svg>';
}

function hero(c,n){
  var h=hover!=null?hover:n,s=Math.round(at(c,h)),next=windows(c,Math.ceil(n))[0],logs=today(D.logs);
  var advice=next?'Your next peak is '+hh(next.start)+'–'+hh(next.end)+'. Put your hardest work there.':'No more peaks today. Wind down, protect your sleep.';
  if(logs.some(function(l){return l.takenHour>=14}))advice+=' Caffeine after 14:00 still has half its effect at bedtime.';
  return '<section class="k-card k-hero"><div class="k-head" style="width:100%"><span class="k-cat">'+K.icon('bolt')+'Energy</span><span class="k-time">'+(hover!=null?'at '+hh(hover):'right now · '+hh(n))+'</span></div>'
    +'<div class="k-ringbox">'+K.ring(s/100,{size:190,color:color(s),label:'Energy '+s})+'<div class="k-in"><div class="k-big" style="font-size:54px">'+s+'</div><div class="k-sub">'+tierFor(s)+'</div></div></div>'
    +'<p class="k-sub" style="margin:0;max-width:44ch">'+K.esc(advice)+'</p>'
    +(typeof D.whoop.recovery==='number'?'<span class="k-tag">'+K.icon('heart')+'Recovery '+Math.round(D.whoop.recovery)+'%'+(recSource?' from Vitals':'')+'</span>':'<span class="k-tag k-neutral">Log sleep in Vitals to shape this curve</span>')+'</section>';
}
function curveInner(c){var s=hover!=null?Math.round(at(c,hover)):0;return chart(c)+(hover!=null?'<div class="tip" style="left:'+(hover/24*100).toFixed(1)+'%">'+hh(hover)+' · '+s+'</div>':'')}
function render(){
  var c=curve(),n=nowH(),ws=windows(c,0);
  var ev=today(D.events),logs=today(D.logs);
  var html='<div id="hero">'+hero(c,n)+'</div>'
    +'<h2 class="k-title">Today’s curve<span class="k-label">green = peak windows</span></h2>'
    +'<section class="k-card"><div class="curve" id="curve">'+curveInner(c)+'</div><div class="hours"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>'
    +(ev.length?'<div class="plan">'+ev.map(function(e){var t=TONES[e.tone]||TONES[LEGACY_TONE[e.tone]]||TONES.meeting;return '<span title="'+K.esc(e.title)+' '+hh(e.startHour)+'–'+hh(e.endHour)+'" style="left:'+(e.startHour/24*100).toFixed(2)+'%;width:'+Math.max(2,(e.endHour-e.startHour)/24*100).toFixed(2)+'%;background:color-mix(in srgb,'+t[1]+' 26%,var(--k-surface))">'+K.esc(e.title)+'</span>'}).join('')+'<i class="now" style="left:'+(n/24*100).toFixed(2)+'%"></i></div>':'')
    +'<p class="k-note" style="margin:8px 0 0">Drag or hover across the curve to read any hour.</p></section>'
    +(ws.length?'<div class="k-list">'+ws.map(function(w,i){return '<div class="k-row win"><span class="k-ico" style="--k-tint:var(--k-signal)">'+K.icon(i===0?'star':'target')+'</span><span class="k-main"><b>'+hh(w.start)+' – '+hh(w.end)+'</b><span>'+(i===0?'Your best window today':'Another strong window')+(w.end<=n?' · passed':'')+'</span></span><span class="k-end">'+Math.round(w.avg)+'<small>avg</small></span></div>'}).join('')+'</div>':'')
    +'<h2 class="k-title">How do you feel right now?</h2>'
    +'<div class="feelrow">'+FEELS.map(function(f){return '<button data-feel="'+f[1]+'" style="--c:'+f[2]+'"><i></i>'+f[0]+'</button>'}).join('')+'</div>'
    +'<p class="k-note">Each tap marks the curve. Over days the mentor sees when your real energy differs from the prediction.</p>'
    +'<h2 class="k-title">Caffeine<button data-caf>+ Log</button></h2>'
    +(logs.length?'<div class="k-list">'+logs.map(function(l){var sub=SUBSTANCES[l.key]||{name:l.key,unit:'mg'};return '<div class="k-row"><span class="k-ico">'+K.icon('cup')+'</span><span class="k-main"><b>'+K.esc(sub.name)+'</b><span>'+hh(l.takenHour)+' · '+l.dose+' '+sub.unit+'</span></span><button class="k-x" data-dellog="'+D.logs.indexOf(l)+'" aria-label="Delete">'+K.icon('trash')+'</button></div>'}).join('')+'</div>':'<div class="k-card k-empty" style="padding:16px">'+K.icon('cup')+'<span>No caffeine logged today. Each cup lifts the curve for a few hours.</span></div>')
    +'<h2 class="k-title">Today’s plan<button data-ev>+ Add</button></h2>'
    +(ev.length?'<div class="k-list">'+ev.slice().sort(function(a,b){return a.startHour-b.startHour}).map(function(e){var t=TONES[e.tone]||TONES[LEGACY_TONE[e.tone]]||TONES.meeting,e1=Math.round(at(c,e.startHour));return '<div class="k-row"><span class="k-ico" style="--k-tint:'+t[1]+'">'+K.icon(e.tone==='workout'?'dumbbell':e.tone==='rest'?'leaf':e.tone==='focus'?'brain':'calendar')+'</span><span class="k-main"><b>'+K.esc(e.title)+'</b><span>'+hh(e.startHour)+'–'+hh(e.endHour)+' · energy '+e1+(e.tone==='focus'&&e1<65?' · a peak window would suit it better':'')+'</span></span><button class="k-x" data-delev="'+D.events.indexOf(e)+'" aria-label="Delete">'+K.icon('trash')+'</button></div>'}).join('')+'</div>':'<div class="k-card k-empty" style="padding:16px">'+K.icon('calendar')+'<span>Add deep work, a workout or meetings and see how they sit on your energy.</span></div>')
    +'<div class="k-list"><button class="k-row" data-weight><span class="k-ico">'+K.icon('scale')+'</span><span class="k-main"><b>Body weight</b><span>Caffeine hits lighter people harder</span></span><span class="k-end">'+D.weightKg+'<small>kg</small></span>'+K.icon('chev','k-chev')+'</button></div>';
  document.getElementById('app').innerHTML=html;
  var cv=document.getElementById('curve');
  // Hover redraws only the chart and the ring, so the page under the pointer stays put.
  var redraw=function(){cv.innerHTML=curveInner(c);document.getElementById('hero').innerHTML=hero(c,nowH())};
  var pick=function(e){var r=cv.getBoundingClientRect();hover=Math.max(0,Math.min(24,(e.clientX-r.left)/r.width*24));redraw()};
  cv.onpointermove=pick;cv.onpointerdown=pick;cv.onpointerleave=function(){hover=null;redraw()};
}

function timeField(id,label,h){return '<label class="k-field"><span>'+label+'</span><input class="k-input" type="time" id="'+id+'" value="'+hh(h)+'"></label>'}
function readTime(el,id){var v=el.querySelector('#'+id).value;if(!/^\d{2}:\d{2}$/.test(v))return null;var p=v.split(':');return Number(p[0])+Number(p[1])/60}

document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.closest('.k-sheet'))return;var a=function(n){return b.getAttribute(n)};
  if(a('data-feel')!=null){D.taps.push({id:'t'+Date.now(),hour:nowH(),value:Number(a('data-feel')),day:K.dayKey()});persist();K.toast('Logged: you feel '+FEELS.filter(function(f){return f[1]===Number(a('data-feel'))})[0][0].toLowerCase()+'.');render();return}
  if(a('data-dellog')!=null){D.logs.splice(Number(a('data-dellog')),1);persist();render();return}
  if(a('data-delev')!=null){D.events.splice(Number(a('data-delev')),1);persist();render();return}
  if(b.hasAttribute('data-caf')){var key='coffee';K.sheet('Log caffeine','<div class="k-chips">'+Object.keys(SUBSTANCES).map(function(k,i){var s=SUBSTANCES[k];return '<button type="button" class="k-chip" data-k="'+k+'" aria-pressed="'+(i===0)+'">'+s.name+' · '+s.defaultDose+' mg</button>'}).join('')+'</div>'+timeField('ct','When',nowH())+'<label class="k-field"><span>Dose (mg)</span><input class="k-input" id="cd" inputmode="numeric" value="95"></label><button class="k-btn k-wide" data-ok>'+K.icon('check')+'Log it</button>',function(el,close){
      el.addEventListener('click',function(ev){var x=ev.target.closest('[data-k]');if(x){key=x.getAttribute('data-k');el.querySelectorAll('[data-k]').forEach(function(y){y.setAttribute('aria-pressed',String(y===x))});el.querySelector('#cd').value=SUBSTANCES[key].defaultDose}});
      el.querySelector('[data-ok]').onclick=function(){var t=readTime(el,'ct'),d=parseInt(el.querySelector('#cd').value,10);if(t==null||!(d>0)){K.toast('Pick a time and a dose.');return}D.logs.push({key:key,dose:d,tolerance:5,takenHour:t,day:K.dayKey()});persist();close();render()}});return}
  if(b.hasAttribute('data-ev')){var tone='focus',n=Math.ceil(nowH());K.sheet('Add to today','<label class="k-field"><span>What</span><input class="k-input" id="et" maxlength="40" placeholder="e.g. Edit the video"></label><div class="k-chips">'+Object.keys(TONES).map(function(k,i){return '<button type="button" class="k-chip" data-t="'+k+'" aria-pressed="'+(i===0)+'">'+TONES[k][0]+'</button>'}).join('')+'</div><div class="k-grid k-2">'+timeField('es','From',Math.min(23,n))+timeField('ee','To',Math.min(24,n+1))+'</div><button class="k-btn k-wide" data-ok>Add</button>',function(el,close){
      el.addEventListener('click',function(ev){var x=ev.target.closest('[data-t]');if(x){tone=x.getAttribute('data-t');el.querySelectorAll('[data-t]').forEach(function(y){y.setAttribute('aria-pressed',String(y===x))})}});
      el.querySelector('[data-ok]').onclick=function(){var t=el.querySelector('#et').value.trim(),s=readTime(el,'es'),en=readTime(el,'ee');if(!t){el.querySelector('#et').focus();return}if(s==null||en==null){K.toast('Pick both times.');return}if(en<=s)en=s+1;D.events.push({title:t.slice(0,40),startHour:s,endHour:Math.min(24,en),tone:tone,day:K.dayKey()});persist();close();render()}});return}
  if(b.hasAttribute('data-weight')){K.sheet('Body weight','<input class="k-input" id="bw" inputmode="decimal" value="'+D.weightKg+'" style="font:700 32px var(--k-display);text-align:center;min-height:64px"><p class="k-note">In kg. Used only for how strongly caffeine lifts your curve.</p><button class="k-btn k-wide" data-ok>Save</button>',function(el,close){el.querySelector('[data-ok]').onclick=function(){var v=parseFloat(String(el.querySelector('#bw').value).replace(',','.'));if(!(v>=30&&v<=300)){K.toast('Type a weight between 30 and 300 kg.');return}D.weightKg=Math.round(v*10)/10;persist();close();render()}});return}
});
setInterval(function(){if(hover==null&&!document.querySelector('.k-veil'))render()},60000);

(async function(){
  var B=window.Vitality;
  try{var s=await B.load();if(s&&typeof s==='object'&&!Array.isArray(s)){if(typeof s.weightKg==='number')D.weightKg=s.weightKg;if(s.whoop&&typeof s.whoop==='object')D.whoop=s.whoop;['logs','events','taps'].forEach(function(k){if(Array.isArray(s[k]))D[k]=s[k]})}}
  catch(e){K.toast('Could not load Peak: '+(e&&e.message||e))}
  // Vitals feeds Peak directly: today's recovery (or the latest night) shapes the curve.
  try{if(typeof B.read==='function'){var v=await B.read('vitals');if(v&&typeof v==='object'&&!Array.isArray(v)){var tk=K.dayKey(),days=Object.keys(v).filter(function(k){return /^\d{4}-\d{2}-\d{2}$/.test(k)}).sort(),use=v[tk]?tk:days[days.length-1],rec=use?recoveryFromVitals(v[use]):null;if(typeof rec==='number'){D.whoop=Object.assign({},D.whoop,{recovery:rec});recSource='vitals'}}}}
  catch(e){K.toast('Could not read your Vitals, so the curve ignores sleep: '+(e&&e.message||e))}
  render();
})();
</script>
</body>
</html>
