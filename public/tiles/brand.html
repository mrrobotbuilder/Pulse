<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brand</title>
<!--
  Brand: your audience and your output. Built on the tile kit
  (lib/tiles/tileKit.ts). Sealed: no network; saves through window.Vitality.
  Live counts come through the host bridge: window.Vitality.tiktok(handle) is
  keyless, window.Vitality.youtube(handle) uses the owner's own YouTube key.
  Instagram, X and LinkedIn are logged by hand.
  Saved shape (lib/tiles/tileStats.ts reads accounts[].history):
    { accounts: [{ id, platform, handle, history: [{ t, count }] }],
      posts: [{ id, at, platform, title?, views? }], goal?: { count }, postGoal?: number }
-->
<style>
  .lg{display:inline-grid;place-items:center;width:20px;height:20px}
  .lg svg{width:18px;height:18px}
  .acct .k-head .k-cat{color:var(--pc)}
  .acct .count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .plat{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .plat button{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--k-line);background:var(--k-surface);font:700 15px var(--k-body);color:var(--k-text)}
  .plat button[aria-pressed=true]{border-color:var(--k-text);box-shadow:inset 0 0 0 1.5px var(--k-text)}
  .plat button .lg{color:var(--pc)}
</style>
</head>
<body class="k-hue-magenta">
<main class="k-page" id="app"></main>
<script>
var K=window.PulseKit;
var LOGOS={
  tiktok:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.53.02C13.84 0 15.14.01 16.44 0c.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.920-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.070-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5.2"/><circle cx="12" cy="12" r="4.4"/><circle cx="17.4" cy="6.6" r="1.15" fill="currentColor" stroke="none"/></svg>',
  youtube:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.11-2.12C19.51 3.55 12 3.55 12 3.55s-7.51 0-9.39.53A3 3 0 0 0 .5 6.2 31.3 31.3 0 0 0 0 12a31.3 31.3 0 0 0 .5 5.8 3 3 0 0 0 2.11 2.12c1.88.53 9.39.53 9.39.53s7.51 0 9.39-.53a3 3 0 0 0 2.11-2.12A31.3 31.3 0 0 0 24 12a31.3 31.3 0 0 0-.5-5.8zM9.6 15.6V8.4L15.83 12 9.6 15.6z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.41l-5.8-7.59-6.64 7.59H.46l8.6-9.83L0 1.15h7.59l5.24 6.93 6.07-6.93z"/></svg>',
  linkedin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>'
};
var PLATFORMS={
  tiktok:{label:'TikTok',color:'color-mix(in srgb,#00B8B0 75%,var(--k-text))',unit:'followers',live:'keyless'},
  instagram:{label:'Instagram',color:'color-mix(in srgb,#E1306C 80%,var(--k-text))',unit:'followers'},
  youtube:{label:'YouTube',color:'color-mix(in srgb,#E00022 85%,var(--k-text))',unit:'subscribers',live:'key'},
  x:{label:'X',color:'var(--k-text)',unit:'followers'},
  linkedin:{label:'LinkedIn',color:'color-mix(in srgb,#0A66C2 85%,var(--k-text))',unit:'followers'}
};
var state={accounts:[],posts:[]},fetching={},keyNote={};
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function persist(){return Promise.resolve(window.Vitality.save(state)).catch(function(e){K.toast('Could not save: '+(e&&e.message||e))})}
function compact(n){if(n==null)return '—';if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1)+'M';if(n>=1e4)return Math.round(n/1e3)+'K';return n.toLocaleString('en-US')}
function hist(a){return (a.history||[]).filter(function(p){return typeof p.count==='number'&&typeof p.t==='number'})}
function last(a){var h=hist(a);return h.length?h[h.length-1].count:null}
function at(a,t){var h=hist(a),v=null;h.forEach(function(p){if(p.t<=t)v=p.count});return v}
function weekDelta(a){var l=last(a),b=at(a,Date.now()-7*864e5);return l!=null&&b!=null?l-b:null}
function total(){return state.accounts.reduce(function(s,a){return s+(last(a)||0)},0)}
function uid(p){return p+Math.random().toString(36).slice(2,8)}
function plat(p){return PLATFORMS[p]||{label:p,color:'var(--k-tint)',unit:'followers'}}

function liveFn(a){var V=window.Vitality||{};if(a.platform==='tiktok'&&V.tiktok)return function(){return V.tiktok(a.handle)};if(a.platform==='youtube'&&V.youtube)return function(){return V.youtube(a.handle)};return null}
async function refreshLive(a){
  var fn=liveFn(a);if(!fn||fetching[a.id])return;
  fetching[a.id]=1;render();
  try{var c=await fn();if(typeof c==='number'&&c>=0){var h=(a.history=a.history||[]),p=h[h.length-1],now=Date.now();if(!(p&&p.count===c&&now-p.t<6*3600e3)){h.push({t:now,count:c});persist()}}}
  catch(e){if(a.platform==='youtube'&&String(e&&e.message||'')==='no_key')keyNote[a.id]=1}
  finally{delete fetching[a.id];render()}
}

/* Weeks to the goal at the pace of the last 30 days (or since the first count). */
function eta(){
  var g=state.goal&&state.goal.count;if(!g)return null;var now=total();if(now>=g)return 'Goal reached. Time to set a bigger one.';
  var back=Date.now()-30*864e5,then=0,span=0;
  state.accounts.forEach(function(a){var h=hist(a);if(!h.length)return;var b=at(a,back);if(b==null){b=h[0].count;span=Math.max(span,Date.now()-h[0].t)}else span=Math.max(span,Date.now()-back);then+=b});
  var gain=now-then;if(gain<=0||span<864e5)return 'Log a few days of counts and I can tell you when you get there.';
  var perWeek=gain/(span/(7*864e5)),weeks=Math.ceil((g-now)/perWeek);
  return 'At +'+compact(Math.round(perWeek))+' a week, you reach it in about '+(weeks>104?Math.round(weeks/52)+' years':weeks>8?Math.round(weeks/4.3)+' months':weeks+' weeks')+'.';
}

function render(){
  var t=total(),wd=state.accounts.map(weekDelta).filter(function(x){return x!=null}),wsum=wd.reduce(function(s,x){return s+x},0);
  var g=state.goal&&state.goal.count,posts=Array.isArray(state.posts)?state.posts:(state.posts=[]);
  var week=[],labels=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=K.dayKey(d);week.push(posts.filter(function(p){return K.dayKey(new Date(p.at))===k}).length);labels.push(i===0?'Today':DAYS[d.getDay()])}
  var wposts=week.reduce(function(s,x){return s+x},0),pg=state.postGoal||0;
  var html='<section class="k-card k-hero"><div class="k-head" style="width:100%"><span class="k-cat">'+K.icon('globe')+'Audience</span><span class="k-time">'+state.accounts.length+' account'+(state.accounts.length===1?'':'s')+'</span></div>'
    +(g?'<div class="k-ringbox">'+K.ring(t/g,{size:200,label:compact(t)+' of '+compact(g)})+'<div class="k-in"><div class="k-big" style="font-size:48px">'+compact(t)+'</div><div class="k-sub">of '+compact(g)+' goal</div></div></div>':'<div class="k-big">'+(state.accounts.length?compact(t):'—')+'</div><div class="k-sub">followers and subscribers, all platforms</div>')
    +'<div>'+(wd.length?'<span class="'+(wsum>=0?'k-up':'k-down')+'">'+(wsum>=0?'▲ +':'▼ ')+compact(Math.abs(wsum))+'</span> <span class="k-sub">this week</span>':'<span class="k-sub">weekly growth shows after a week of counts</span>')+'</div>'
    +(g?'<p class="k-sub" style="margin:4px 0 0">'+K.esc(eta())+'</p>':'')
    +'<div class="k-row-btns" style="width:100%;margin-top:6px"><button class="k-btn k-ghost k-sm" data-goal>'+K.icon('target')+(g?'Change goal':'Set an audience goal')+'</button></div></section>';

  state.accounts.forEach(function(a){
    var P=plat(a.platform),h=hist(a),d=weekDelta(a),l=last(a);
    html+='<section class="k-card acct" style="--pc:'+P.color+'"><div class="k-head"><span class="k-cat"><span class="lg">'+(LOGOS[a.platform]||'')+'</span>'+P.label+'</span><span class="k-time">'+K.esc(a.handle)+'</span></div>'
      +'<div class="count"><div class="k-mid" style="font-size:38px">'+(fetching[a.id]?'…':compact(l))+'</div><span class="k-sub">'+P.unit+'</span>'+(d!=null?'<span class="k-tag" style="--k-tint:'+(d>=0?'var(--k-signal)':'var(--k-accent)')+'">'+(d>=0?'+':'−')+compact(Math.abs(d))+' this week</span>':'')+'</div>'
      +'<div style="margin-top:10px">'+K.line(h.map(function(p){return p.count}),{height:110,color:P.color,label:P.label+' growth',labels:h.length>1?[new Date(h[0].t).toLocaleDateString(undefined,{month:'short',day:'numeric'}),'Now']:null,empty:P.live==='keyless'?'Pulling your live count. The line draws as your following moves.':P.live==='key'&&keyNote[a.id]?'Add your own free YouTube key to auto-pull, or log the count by hand.':'Log your count every few days and the growth line draws itself.'})+'</div>'
      +'<div class="k-row-btns" style="margin-top:10px"><button class="k-btn k-soft k-sm" data-log="'+a.id+'">'+K.icon('edit')+'Log count</button>'+(liveFn(a)?'<button class="k-btn k-ghost k-sm" data-refresh="'+a.id+'">'+K.icon('up')+'Refresh</button>':'')+'<button class="k-btn k-ghost k-sm" data-manage="'+a.id+'" aria-label="Manage '+K.esc(P.label)+'">'+K.icon('list')+'Manage</button></div></section>';
  });
  html+='<button class="k-btn k-ghost k-wide" data-connect>'+K.icon('plus')+(state.accounts.length?'Connect another account':'Connect your first account')+'</button>';

  html+='<h2 class="k-title">Posting<button data-post>+ I posted</button></h2>'
    +'<section class="k-card"><div class="k-grid k-3" style="margin-bottom:12px"><div><div class="k-label">This week</div><div class="k-mid">'+wposts+(pg?'<small>/ '+pg+'</small>':'')+'</div></div><div><div class="k-label">All time</div><div class="k-mid">'+posts.length+'</div></div><div><div class="k-label">Last post</div><div class="k-mid" style="font-size:20px">'+(posts.length?new Date(posts[posts.length-1].at).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—')+'</div></div></div>'
    +K.bars(week,{labels:labels,now:6,height:110,goal:pg?pg/7:0,label:'Posts per day this week'})+'</section>'
    +(posts.length?'<div class="k-list">'+posts.slice(-8).reverse().map(function(p){var P=plat(p.platform);return '<div class="k-row"><span class="k-ico lg" style="color:'+P.color+'">'+(LOGOS[p.platform]||K.icon('send'))+'</span><span class="k-main"><b>'+K.esc(p.title||'Post on '+P.label)+'</b><span>'+P.label+' · '+new Date(p.at).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+(p.views?' · '+compact(p.views)+' views':'')+'</span></span><button class="k-x" data-delpost="'+p.id+'" aria-label="Delete post">'+K.icon('trash')+'</button></div>'}).join('')+'</div>':'')
    +'<div class="k-list"><button class="k-row" data-postgoal><span class="k-ico">'+K.icon('calendar')+'</span><span class="k-main"><b>Posts a week</b><span>Your publishing target</span></span><span class="k-end">'+(pg||'not set')+'</span>'+K.icon('chev','k-chev')+'</button></div>'
    +'<p class="k-note">TikTok pulls live with no setup. YouTube pulls live with your own free key. Instagram, X and LinkedIn: log the count by hand.</p>';
  document.getElementById('app').innerHTML=html;
}

function pickPlatform(cb,title,taken){
  var choice=null;
  K.sheet(title,'<div class="plat">'+Object.keys(PLATFORMS).map(function(p){var P=PLATFORMS[p],dis=taken&&taken.indexOf(p)>-1;return '<button type="button" data-p="'+p+'" style="--pc:'+P.color+'" aria-pressed="false"'+(dis?' disabled':'')+'><span class="lg">'+LOGOS[p]+'</span>'+P.label+(dis?' ✓':'')+'</button>'}).join('')+'</div><div id="rest"></div>',function(el,close){
    el.addEventListener('click',function(e){var b=e.target.closest('[data-p]');if(!b||b.disabled)return;choice=b.getAttribute('data-p');el.querySelectorAll('[data-p]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});cb(choice,el.querySelector('#rest'),close)});
  });
}

document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.closest('.k-sheet'))return;var a=function(n){return b.getAttribute(n)};
  var acct=function(id){return state.accounts.filter(function(x){return x.id===id})[0]};
  if(b.hasAttribute('data-connect')){pickPlatform(function(p,rest,close){var P=PLATFORMS[p];rest.innerHTML='<label class="k-field"><span>Your '+P.label+' handle</span><input class="k-input" id="hn" placeholder="@you" maxlength="60"></label><label class="k-field"><span>Current '+P.unit+' (optional'+(P.live?', it pulls live':'')+')</span><input class="k-input" id="hc" inputmode="numeric" placeholder="e.g. 1250"></label><button class="k-btn k-wide" id="go">Connect '+P.label+'</button>';var hn=rest.querySelector('#hn');hn.focus();rest.querySelector('#go').onclick=function(){var h=hn.value.trim();if(!h){hn.focus();return}var c=parseInt(String(rest.querySelector('#hc').value).replace(/[^0-9]/g,''),10);var ac={id:uid('a'),platform:p,handle:h.slice(0,60),history:isFinite(c)?[{t:Date.now(),count:c}]:[]};state.accounts.push(ac);persist();close();render();refreshLive(ac)}},'Connect an account',state.accounts.map(function(x){return x.platform}));return}
  if(a('data-log')){var ac=acct(a('data-log'));K.sheet('Log '+plat(ac.platform).label+' count','<input class="k-input" id="lc" inputmode="numeric" value="'+(last(ac)==null?'':last(ac))+'" style="font:700 32px var(--k-display);text-align:center;min-height:64px"><p class="k-note">Today’s '+plat(ac.platform).unit+' for '+K.esc(ac.handle)+'.</p><button class="k-btn k-wide" data-ok>Save</button>',function(el,close){el.querySelector('[data-ok]').onclick=function(){var n=parseInt(String(el.querySelector('#lc').value).replace(/[^0-9]/g,''),10);if(!isFinite(n)){el.querySelector('#lc').focus();return}(ac.history=ac.history||[]).push({t:Date.now(),count:n});persist();close();render()}});return}
  if(a('data-refresh')){refreshLive(acct(a('data-refresh')));return}
  if(a('data-manage')){var m=acct(a('data-manage'));K.sheet(plat(m.platform).label,'<label class="k-field"><span>Handle</span><input class="k-input" id="mh" value="'+K.esc(m.handle)+'" maxlength="60"></label><p class="k-sub" style="margin:0">'+hist(m).length+' counts logged since '+(hist(m).length?new Date(hist(m)[0].t).toLocaleDateString():'—')+'.</p><div class="k-row-btns"><button class="k-btn k-danger" data-rm>Disconnect</button><button class="k-btn" data-ok>Save</button></div>',function(el,close){el.querySelector('[data-ok]').onclick=function(){var h=el.querySelector('#mh').value.trim();if(h)m.handle=h.slice(0,60);persist();close();render()};el.querySelector('[data-rm]').onclick=function(){K.sheet('Disconnect '+plat(m.platform).label+'?','<p style="margin:0">Its count history is deleted too.</p><div class="k-row-btns"><button class="k-btn k-ghost" data-k-close>Keep it</button><button class="k-btn" data-yes>Disconnect</button></div>',function(el2,close2){el2.querySelector('[data-yes]').onclick=function(){state.accounts=state.accounts.filter(function(x){return x!==m});persist();close2();close();render()}})}});return}
  if(b.hasAttribute('data-post')){pickPlatform(function(p,rest,close){rest.innerHTML='<label class="k-field"><span>What was it? (optional)</span><input class="k-input" id="pt" maxlength="80" placeholder="e.g. Day in my life vlog"></label><label class="k-field"><span>Views so far (optional)</span><input class="k-input" id="pv" inputmode="numeric" placeholder="e.g. 3400"></label><button class="k-btn k-wide" id="go">'+K.icon('check')+'Log the post</button>';rest.querySelector('#go').onclick=function(){var v=parseInt(String(rest.querySelector('#pv').value).replace(/[^0-9]/g,''),10);state.posts.push({id:uid('p'),at:Date.now(),platform:p,title:rest.querySelector('#pt').value.trim().slice(0,80)||undefined,views:isFinite(v)?v:undefined});persist();close();K.toast('Logged. '+state.posts.filter(function(x){return Date.now()-x.at<7*864e5}).length+' posts this week.');render()}},'Where did you post?');return}
  if(a('data-delpost')){state.posts=state.posts.filter(function(p){return p.id!==a('data-delpost')});persist();render();return}
  if(b.hasAttribute('data-goal')){K.sheet('Audience goal','<input class="k-input" id="gv" inputmode="numeric" value="'+(state.goal&&state.goal.count||'')+'" placeholder="e.g. 100000" style="font:700 32px var(--k-display);text-align:center;min-height:64px"><p class="k-note">Followers and subscribers across every platform, added up.</p><button class="k-btn k-wide" data-ok>Save goal</button>',function(el,close){el.querySelector('[data-ok]').onclick=function(){var n=parseInt(String(el.querySelector('#gv').value).replace(/[^0-9]/g,''),10);state.goal=n>0?{count:n}:undefined;persist();close();render()}});return}
  if(b.hasAttribute('data-postgoal')){K.sheet('Posts a week','<div class="k-chips">'+[1,2,3,5,7,14].map(function(n){return '<button class="k-chip" data-n="'+n+'" aria-pressed="'+(state.postGoal===n)+'">'+n+'</button>'}).join('')+'</div><p class="k-note">Consistency beats volume. Pick what you can keep for months.</p>',function(el,close){el.addEventListener('click',function(ev){var x=ev.target.closest('[data-n]');if(x){state.postGoal=Number(x.getAttribute('data-n'));persist();close();render()}})});return}
});

(async function(){
  try{
    var d=await window.Vitality.load();
    if(d&&typeof d==='object'&&!Array.isArray(d)){
      if(Array.isArray(d.accounts))state.accounts=d.accounts.filter(function(a){return a&&a.platform&&a.handle}).map(function(a){return Object.assign({},a,{id:a.id||uid('a'),history:Array.isArray(a.history)?a.history:[]})});
      if(Array.isArray(d.posts))state.posts=d.posts;
      if(d.goal&&typeof d.goal.count==='number')state.goal=d.goal;
      if(typeof d.postGoal==='number')state.postGoal=d.postGoal;
    }
  }catch(e){K.toast('Could not load your accounts: '+(e&&e.message||e))}
  render();
  for(var i=0;i<state.accounts.length;i++){await refreshLive(state.accounts[i]);await new Promise(function(r){setTimeout(r,1200)})}
})();
</script>
</body>
</html>
