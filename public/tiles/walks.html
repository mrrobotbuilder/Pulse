<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walks</title>
<!--
  Walks: read-only. STEGA (a separate app) logs each walk to /api/walks; the
  board fetches that log and writes it into this tile's data through the host
  bridge; this tile only reads it back with window.Pulse.load(). It saves
  nothing (the board would overwrite it on the next sync).
  Data: { walks: [{ name, date: 'YYYY-MM-DD', steps, distanceM, durationMin }], syncedAt }
  Built on the tile kit (lib/tiles/tileKit.ts).
-->
</head>
<body class="k-hue-orange">
<main class="k-page" id="app"></main>
<script>
var K=window.PulseKit;
var DAY_GOAL=10000;
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function n(x){return typeof x==='number'&&isFinite(x)?x:0}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function plus(d,k){var x=new Date(d);x.setDate(x.getDate()+k);return x}
function steps(s){return Math.round(s).toLocaleString('en-US')}
function km(m){return K.fmt(m/1000,1)+' km'}
function pace(w){var k=n(w.distanceM)/1000;if(!k||!n(w.durationMin))return '';var p=n(w.durationMin)/k,m=Math.floor(p),s=Math.round((p-m)*60);return m+':'+String(s).padStart(2,'0')+' /km'}

function render(walks,syncedAt){
  if(!walks.length){
    document.getElementById('app').innerHTML='<section class="k-card k-empty">'+K.icon('walk')+'<b>No walks yet</b><span>Plan one in STEGA and tap <b>Logga promenaden</b> when you are back. It shows up here on its own.</span></section>';
    return;
  }
  var mon=monday(new Date()),days=[],by={},labels=[];for(var i=0;i<7;i++){var k=K.dayKey(plus(mon,i));days.push(k);by[k]=0;labels.push(k===K.dayKey()?'Today':DAYS[i])}
  var wk={steps:0,walks:0,dist:0,min:0};
  walks.forEach(function(w){if(by[w.date]!==undefined){by[w.date]+=n(w.steps);wk.steps+=n(w.steps);wk.walks++;wk.dist+=n(w.distanceM);wk.min+=n(w.durationMin)}});
  var weeks=[],wl=[];for(var j=7;j>=0;j--){var a=K.dayKey(plus(mon,-7*j)),b=K.dayKey(plus(mon,-7*j+7)),s=0;walks.forEach(function(w){if(w.date>=a&&w.date<b)s+=n(w.steps)});weeks.push(s);wl.push(j===0?'Now':a.slice(5).replace('-','/'))}
  var longest=walks.reduce(function(m,w){return n(w.distanceM)>n(m.distanceM)?w:m},walks[0]);
  var dates={};walks.forEach(function(w){dates[w.date]=1});var streak=0;for(var d=dates[K.dayKey()]?0:1;d<400;d++){if(dates[K.dayKey(plus(new Date(),-d))])streak++;else break}
  var goal=DAY_GOAL*7,today=by[K.dayKey()]||0;
  document.getElementById('app').innerHTML=
    '<section class="k-card k-hero"><div class="k-head" style="width:100%"><span class="k-cat">'+K.icon('walk')+'This week</span><span class="k-time">'+(syncedAt?'synced '+new Date(syncedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'from STEGA')+'</span></div>'
      +'<div class="k-ringbox">'+K.rings([{value:wk.steps/goal},{value:today/DAY_GOAL,color:'var(--k-gold)'}],{size:210,label:steps(wk.steps)+' steps this week'})+'<div class="k-in"><div class="k-big" style="font-size:44px">'+steps(wk.steps)+'</div><div class="k-sub">of '+steps(goal)+' steps</div></div></div>'
      +'<p class="k-sub" style="margin:0">'+K.esc(today>=DAY_GOAL?'10,000 steps today. Goal done.':today?steps(DAY_GOAL-today)+' steps to go today. A 20-minute walk is about 2,000.':'No steps logged today yet. A 20-minute walk is about 2,000.')+'</p>'
      +'<p class="k-note" style="margin:0">Outer ring: this week against 10,000 a day. Inner ring: today.</p></section>'
    +'<div class="k-grid">'
      +'<div class="k-stat"><div class="k-label">Walks</div><div class="k-mid">'+wk.walks+'</div><div class="k-sub">this week</div></div>'
      +'<div class="k-stat"><div class="k-label">Distance</div><div class="k-mid">'+K.fmt(wk.dist/1000,1)+'<small>km</small></div><div class="k-sub">this week</div></div>'
      +'<div class="k-stat"><div class="k-label">Time on foot</div><div class="k-mid">'+Math.round(wk.min)+'<small>min</small></div><div class="k-sub">this week</div></div>'
      +'<div class="k-stat"><div class="k-label">Streak</div><div class="k-mid">'+streak+'</div><div class="k-sub">days in a row</div></div>'
    +'</div>'
    +'<h2 class="k-title">Steps by day<span class="k-label">dashed = 10,000</span></h2><section class="k-card">'+K.bars(days.map(function(k){return by[k]}),{labels:labels,goal:DAY_GOAL,now:days.indexOf(K.dayKey()),height:150,fmt:steps,label:'Steps per day this week'})+'</section>'
    +'<h2 class="k-title">Eight weeks</h2><section class="k-card">'+K.bars(weeks,{labels:wl,now:7,height:130,fmt:steps,label:'Steps per week'})+'</section>'
    +'<h2 class="k-title">Recent walks</h2>'
    +'<div class="k-list">'+walks.slice(0,10).map(function(w){return '<div class="k-row"><span class="k-ico">'+K.icon(w===longest?'trophy':'walk')+'</span><span class="k-main"><b>'+K.esc(w.name||'Walk')+'</b><span>'+K.esc(new Date(w.date+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}))+' · '+km(n(w.distanceM))+' · '+Math.round(n(w.durationMin))+' min'+(pace(w)?' · '+pace(w):'')+'</span></span><span class="k-end">'+steps(n(w.steps))+'<small>steps</small></span></div>'}).join('')+'</div>'
    +'<p class="k-note">Longest walk: '+K.esc(longest.name||'a walk')+', '+km(n(longest.distanceM))+'. Walks are logged in STEGA and land here by themselves.</p>';
}

(async function(){
  var d=null;
  try{d=await window.Pulse.load()}catch(e){K.toast('Could not load your walks: '+(e&&e.message||e))}
  var walks=(d&&Array.isArray(d.walks))?d.walks.filter(function(w){return w&&typeof w.date==='string'}):[];
  render(walks,d&&d.syncedAt);
})();
</script>
</body>
</html>
