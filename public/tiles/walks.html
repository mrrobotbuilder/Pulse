<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#050506" />
<title>Walks</title>
<!--
  WALKS — the week's walking, logged from STEGA (stega-oriad.vercel.app).

  Sealed: no network. The board fetches /api/walks and writes the log through
  the host bridge; this tile only reads it back with window.Pulse.load().
  Store: { walks: [ { id, date:'YYYY-MM-DD', steps, distanceM, durationMin, kcal, name } ], syncedAt }
-->
<style>
  :root{
    --bg:#050506;--fg:#ededf0;--brand:#6EE7B7;
    --muted:#84848c;--muted-strong:#a8a8b0;--border:#1d1d22;--border-strong:#2a2a33;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --serif:Georgia,'Times New Roman',serif;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);display:flex;justify-content:center;padding:40px 20px;-webkit-font-smoothing:antialiased;position:relative}
  body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background:
    radial-gradient(58% 44% at 50% -6%, rgba(110,231,183,.13), transparent 62%),
    radial-gradient(1.5px 1.5px at 14% 16%, rgba(255,255,255,.5), transparent 100%),
    radial-gradient(1px 1px at 76% 10%, rgba(255,255,255,.4), transparent 100%),
    radial-gradient(1.5px 1.5px at 52% 6%, rgba(255,255,255,.32), transparent 100%)}
  .shell{width:100%;max-width:520px}
  h1{font-size:24px;font-weight:600;letter-spacing:-.01em}
  .sub{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 0}

  .hero{margin-top:34px;text-align:center}
  .kick{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--brand)}
  .big{font-family:var(--serif);font-style:italic;font-size:clamp(58px,14vw,96px);line-height:1;color:#fff;margin-top:8px;text-shadow:0 0 44px rgba(110,231,183,.22)}
  .bigLab{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:8px}

  .row{display:flex;gap:12px;margin-top:28px}
  .stat{flex:1;border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:rgba(255,255,255,.02)}
  .statLab{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .statVal{font-size:22px;font-weight:600;margin-top:4px}

  .bars{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:28px}
  .barCol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
  .barTrack{flex:1;width:100%;display:flex;align-items:flex-end;background:rgba(255,255,255,.04);border-radius:5px;overflow:hidden}
  .barFill{width:100%;background:var(--brand);border-radius:5px;min-height:2px;transition:height .5s var(--ease)}
  .barDay{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

  h2{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:32px 0 12px}
  .walk{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
  .walkName{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .walkMeta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
  .walkSteps{font-family:var(--mono);font-size:13px;color:var(--brand);white-space:nowrap}

  .empty{margin-top:40px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7}
  .empty a{color:var(--brand)}
</style>
</head>
<body>
<div class="shell">
  <h1>Walks</h1>
  <p class="sub">Logged from STEGA</p>

  <div id="content"></div>
</div>

<script>
// Standalone fallback so the tile still renders when opened outside the board.
if(!window.Pulse){window.Pulse={save:function(){return Promise.resolve(true)},load:function(){try{return Promise.resolve(JSON.parse(localStorage.getItem('v:prev:walks')||'{}'))}catch(e){return Promise.resolve({})}}}}

var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function ymd(d){return d.toISOString().slice(0,10)}

/** Monday-based start of the ISO week containing `d`. */
function weekStart(d){
  var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var dow=(x.getDay()+6)%7;
  x.setDate(x.getDate()-dow);
  return x;
}

function fmt(n){return Number(n).toLocaleString('en-US')}

function render(walks){
  var el=document.getElementById('content');
  if(!walks.length){
    el.innerHTML='<p class="empty">No walks logged yet.<br>Plan one in STEGA and tap <strong>Logga promenaden</strong>.</p>';
    return;
  }

  var start=weekStart(new Date());
  var days=[];
  for(var i=0;i<7;i++){var d=new Date(start);d.setDate(start.getDate()+i);days.push(ymd(d))}

  var byDay={};
  days.forEach(function(k){byDay[k]=0});
  var weekSteps=0,weekWalks=0,weekDist=0;
  walks.forEach(function(w){
    if(byDay[w.date]!==undefined){
      byDay[w.date]+=w.steps; weekSteps+=w.steps; weekWalks++; weekDist+=w.distanceM;
    }
  });
  var peak=Math.max.apply(null,days.map(function(k){return byDay[k]}).concat([1]));

  var bars=days.map(function(k,i){
    var pct=Math.round((byDay[k]/peak)*100);
    return '<div class="barCol"><div class="barTrack"><div class="barFill" style="height:'+(byDay[k]?Math.max(pct,4):0)+'%"></div></div><div class="barDay">'+DAYS[i]+'</div></div>';
  }).join('');

  var recent=walks.slice(0,5).map(function(w){
    return '<div class="walk"><div><div class="walkName">'+esc(w.name)+'</div>'+
      '<div class="walkMeta">'+w.date+' · '+(w.distanceM/1000).toFixed(2)+' km · '+w.durationMin+' min</div></div>'+
      '<div class="walkSteps">'+fmt(w.steps)+'</div></div>';
  }).join('');

  el.innerHTML=
    '<div class="hero"><div class="kick">This week</div>'+
    '<div class="big">'+fmt(weekSteps)+'</div>'+
    '<div class="bigLab">steps walked</div></div>'+
    '<div class="row">'+
      '<div class="stat"><div class="statLab">Walks</div><div class="statVal">'+weekWalks+'</div></div>'+
      '<div class="stat"><div class="statLab">Distance</div><div class="statVal">'+(weekDist/1000).toFixed(1)+' km</div></div>'+
    '</div>'+
    '<div class="bars">'+bars+'</div>'+
    '<h2>Recent</h2>'+recent;
}

function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML}

(async function(){
  var d=await window.Pulse.load();
  var walks=(d&&Array.isArray(d.walks))?d.walks:[];
  render(walks);
})();
</script>
</body>
</html>
