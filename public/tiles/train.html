<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Train</title>
<!--
  Train: workouts, set by set. Built on the tile kit (lib/tiles/tileKit.ts,
  injected by the board). Sealed: no network; saves through window.Pulse.
  Saved shape (lib/tiles/tileStats.ts reads `log`):
    { log: { '<exercise>': [{ w, r, at }] },          every finished set; cardio sets carry t:'c' (w = km, r = minutes)
      exercises: ['<name you added>'],               your own exercises, next to the built-in library
      session: { date, startedAt, exercises: [names], sets: { name: [{ w, r, done, at? }] } } | null,
      sessions: [{ date, startedAt?, finishedAt, exercises, sets?, volume? }],
      routines: [{ name, exercises }], unit: 'kg' | 'lb', rest: seconds }
-->
<style>
  /* The exercise pictures: a filled figure (a soft outline under a solid body), its
     equipment in the tile colour, a floor and a shadow, on a lit backdrop. */
  .fig{display:block;width:100%;height:auto}
  .fig .p{stroke:var(--k-text);stroke-width:8.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .fig .halo .p{stroke:var(--k-surface);stroke-width:13}
  .fig .halo .hd{fill:var(--k-surface);r:9.5}
  .fig .hd{fill:var(--k-text)}
  .fig .eq{fill:var(--k-tint);stroke:color-mix(in srgb,var(--k-tint) 70%,var(--k-text));stroke-width:1}
  .fig .eqs{stroke:var(--k-tint);stroke-linecap:round;fill:none}
  .fig .gr{stroke:color-mix(in srgb,var(--k-text) 22%,transparent);stroke-width:2}
  .fig .sh{fill:color-mix(in srgb,var(--k-text) 12%,transparent)}
  .pic img.photo{width:100%;height:100%;object-fit:cover;display:block}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pair figure{margin:0;position:relative;aspect-ratio:3/2}
  .pair figcaption{position:absolute;left:8px;bottom:8px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--k-text) 70%,transparent);color:var(--k-surface);font:600 12px var(--k-body)}
  .pic{border-radius:12px;background:radial-gradient(120% 90% at 50% 15%,var(--k-surface),color-mix(in srgb,var(--k-tint) 16%,var(--k-surface)));display:grid;place-items:center;overflow:hidden}
  /* In the how-to sheet the weight moves through three reps, then rests (no endless motion). */
  .demo .fig{width:auto;height:100%;max-width:100%}
  .demo .lift{animation:rep 1.6s ease-in-out 3}
  @keyframes rep{50%{transform:translateY(-4px)}}
  @media (prefers-reduced-motion:reduce){.demo .lift{animation:none}}
  .lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .ex{display:grid;gap:8px;padding:10px;border-radius:16px;border:1px solid var(--k-hair);background:var(--k-card);text-align:left;color:inherit;transition:transform .12s}
  .ex:active{transform:scale(.98)}
  .ex .pic{aspect-ratio:4/3}
  .ex b{font:700 15px/1.2 var(--k-body)}
  .ex span{font-size:12.5px;color:var(--k-muted)}
  .ex .in{display:inline-flex;align-items:center;gap:4px;color:var(--k-signal);font-weight:700}
  .bodymap{display:block;width:100%;max-width:340px;margin:0 auto}
  .bodymap .m{fill:color-mix(in srgb,var(--k-text) 9%,transparent);stroke:var(--k-surface);stroke-width:1.5}
  .bodymap .m.pri{fill:var(--k-tint)}
  .bodymap .m.sec{fill:color-mix(in srgb,var(--k-tint) 42%,transparent)}
  .bodymap .sk{fill:color-mix(in srgb,var(--k-text) 16%,transparent)}
  .bodymap text{font:500 9px var(--k-mono);fill:var(--k-muted);text-anchor:middle}
  .steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
  .steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;counter-increment:s}
  .steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--k-tint) 14%,transparent);color:var(--k-tint);font:700 14px var(--k-body)}
  .live{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .live .k-mid{font-size:24px}
  .exc{display:grid;gap:10px}
  .exc-head{display:flex;align-items:center;gap:12px}
  .exc-head .pic{width:64px;height:48px;flex:none}
  .exc-head .k-main{flex:1;min-width:0}
  .exc-head b{display:block;font:700 17px var(--k-display)}
  .exc-head span{display:block;font-size:13px;color:var(--k-muted)}
  .sets{display:grid;gap:6px}
  .set{display:grid;grid-template-columns:30px 1fr 1fr 1fr 44px;gap:6px;align-items:center}
  .set.hdr{font:500 10.5px var(--k-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--k-muted)}
  .set .n{font:700 14px var(--k-display);text-align:center;color:var(--k-muted)}
  .set .prev{font-size:13px;color:var(--k-muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .set input{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--k-line);background:var(--k-surface);text-align:center;font:700 16px var(--k-body);color:var(--k-text);padding:0 4px}
  .set .ok{width:44px;height:44px;border-radius:10px;border:1px solid var(--k-line);background:var(--k-surface);display:grid;place-items:center;color:var(--k-muted)}
  .set .ok svg{width:20px;height:20px}
  .set.done input{background:color-mix(in srgb,var(--k-signal) 10%,var(--k-surface));border-color:color-mix(in srgb,var(--k-signal) 40%,transparent)}
  .set.done .ok{background:var(--k-signal);border-color:var(--k-signal);color:var(--k-surface)}
  .set.done .n{color:var(--k-signal)}
  .rest{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:18px;background:var(--k-text);color:var(--k-surface);box-shadow:0 8px 28px color-mix(in srgb,var(--k-text) 35%,transparent);width:min(420px,calc(100% - 24px))}
  .rest .t{flex:1;font:700 22px var(--k-display);font-variant-numeric:tabular-nums}
  .rest .t small{display:block;font:500 11px var(--k-mono);letter-spacing:.06em;text-transform:uppercase;opacity:.75}
  .rest button{min-height:40px;padding:0 12px;border-radius:12px;border:0;background:color-mix(in srgb,var(--k-surface) 18%,transparent);color:var(--k-surface);font:700 14px var(--k-body)}
  .rest .bar{position:absolute;left:12px;right:12px;bottom:4px;height:3px;border-radius:3px;background:color-mix(in srgb,var(--k-surface) 20%,transparent);overflow:hidden}
  .rest .bar i{display:block;height:100%;background:var(--k-signal)}
  .routines{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .routine{display:grid;gap:6px;padding:14px;border-radius:16px;border:1px solid var(--k-hair);background:var(--k-card);text-align:left;color:inherit}
  .routine b{font:700 17px var(--k-display)}
  .routine span{font-size:13px;color:var(--k-muted);line-height:1.35}
  .split{display:grid;gap:8px}
  .split div{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center;font-size:14px}
  .split i{display:block;height:10px;border-radius:9px;background:var(--k-tint)}
  .split em{font:700 13px var(--k-mono);font-style:normal;text-align:right}
  .pr{color:var(--k-gold)}
  .bottomspace{height:70px}
</style>
</head>
<body class="k-hue-red">
<main class="k-page" id="app"></main>
<div id="restbox"></div>
<script>
var K=window.PulseKit;

/* ── the pictures: one stick-figure drawing per movement, equipment in the tile's colour ── */
function F(pts){var d='M'+pts[0]+' '+pts[1];for(var i=2;i<pts.length;i+=2)d+=' L'+pts[i]+' '+pts[i+1];return '<path class="p" d="'+d+'"/>'}
function Hd(x,y){return '<circle class="hd" cx="'+x+'" cy="'+y+'" r="7"/>'}
function Pl(x,y,r){return '<circle class="eq" cx="'+x+'" cy="'+y+'" r="'+(r||9)+'"/><circle cx="'+x+'" cy="'+y+'" r="2" fill="var(--k-surface)"/>'}
function Db(x,y){return '<rect class="eq" x="'+(x-9)+'" y="'+(y-5)+'" width="5" height="10" rx="1.5"/><rect class="eq" x="'+(x+4)+'" y="'+(y-5)+'" width="5" height="10" rx="1.5"/><rect class="eq" x="'+(x-5)+'" y="'+(y-1.5)+'" width="10" height="3"/>'}
function Ln(x1,y1,x2,y2,w,o){return '<path class="eqs" d="M'+x1+' '+y1+' L'+x2+' '+y2+'" stroke-width="'+(w||4)+'"'+(o?' opacity="'+o+'"':'')+'/>'}
function Rc(x,y,w,h,o){return '<rect class="eq" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3"'+(o?' opacity="'+o+'"':'')+'/>'}
function Kb(x,y){return '<circle class="eq" cx="'+x+'" cy="'+(y+3)+'" r="7"/><path class="eqs" d="M'+(x-5)+' '+(y-2)+' Q'+x+' '+(y-11)+' '+(x+5)+' '+(y-2)+'" stroke-width="3"/>'}
var STAND=function(x,y){return F([x,y+7,x,y+36])+F([x,y+36,x-8,70])+F([x,y+36,x+8,70])};
var FIG={
  bench:function(e){return Rc(16,58,68,6)+Ln(24,64,24,82,4)+Ln(76,64,76,82,4)+Hd(24,50)+F([31,52,64,52])+F([64,52,80,40,86,82])+F([40,52,40,30])+(e==='Dumbbell'?Db(40,26):Pl(40,24))},
  incline:function(e){return Ln(30,48,64,72,7)+Ln(62,72,86,72,6)+Ln(72,72,72,82,4)+Hd(28,36)+F([34,43,60,62])+F([60,62,80,58,84,82])+F([38,47,44,22])+(e==='Dumbbell'?Db(44,18):Pl(44,16))},
  fly:function(){return Rc(16,58,68,6)+Ln(24,64,24,82,4)+Ln(76,64,76,82,4)+Hd(24,50)+F([31,52,64,52])+F([64,52,80,40,86,82])+F([40,52,26,36])+F([40,52,56,34])+Db(23,32)+Db(59,30)},
  ohp:function(e){return Hd(60,18)+F([60,25,60,54])+F([60,54,52,82])+F([60,54,68,82])+F([60,31,50,10])+F([60,31,70,10])+(e==='Dumbbell'?Db(48,8)+Db(72,8):Ln(34,8,86,8,4)+Pl(34,8,8)+Pl(86,8,8))},
  squat:function(e){return Hd(48,24)+F([52,31,66,54])+F([66,54,42,58,50,82])+F([54,35,44,40])+(e==='Dumbbell'||e==='Kettlebell'?Kb(42,48):Pl(56,28))},
  deadlift:function(){return Hd(36,32)+F([42,38,70,50])+F([70,50,62,66,64,82])+F([48,42,50,66])+Pl(50,72,10)},
  row:function(e){return Hd(32,38)+F([38,42,72,48])+F([72,48,64,66,68,82])+F([46,44,60,56,50,58])+(e==='Dumbbell'?Db(48,60):Pl(48,62,8))},
  pull:function(){return Ln(26,8,94,8,4)+Ln(26,8,26,84,3,.35)+Ln(94,8,94,84,3,.35)+Hd(60,26)+F([54,36,46,9])+F([66,36,74,9])+F([60,33,60,60])+F([60,60,57,82])},
  pulldown:function(){return Ln(60,2,60,12,2)+Ln(38,12,82,12,4)+Rc(44,64,32,6)+Ln(60,70,60,84,4)+Hd(60,30)+F([60,37,60,64])+F([60,64,84,64,86,82])+F([56,40,42,13])+F([64,40,78,13])},
  cablerow:function(){return Rc(98,6,8,78,.35)+Ln(98,50,72,50,2)+Rc(30,68,30,6)+Hd(40,32)+F([43,39,40,66])+F([40,66,70,64,90,70])+F([46,44,60,52,72,50])},
  curl:function(e){return Hd(56,16)+F([56,23,56,52])+F([56,52,50,82])+F([56,52,62,82])+F([56,28,58,46,72,32])+(e==='Barbell'?Pl(74,30,7):Db(74,30))},
  pushdown:function(){return Ln(90,4,90,84,4,.35)+Ln(90,10,72,56,2)+Hd(54,16)+F([54,23,54,52])+F([54,52,48,82])+F([54,52,60,82])+F([54,28,58,44,72,58])+Rc(66,56,12,5)},
  skull:function(){return Rc(16,58,68,6)+Ln(24,64,24,82,4)+Ln(76,64,76,82,4)+Hd(24,50)+F([31,52,64,52])+F([64,52,80,40,86,82])+F([40,52,46,32,30,30])+Pl(28,28,7)},
  ohext:function(){return Hd(58,22)+F([58,29,58,56])+F([58,56,50,82])+F([58,56,66,82])+F([58,33,62,10,48,18])+Db(46,20)},
  raise:function(){return Hd(60,16)+F([60,24,60,52])+F([60,52,52,82])+F([60,52,68,82])+F([60,28,32,30])+F([60,28,88,30])+Db(26,30)+Db(94,30)},
  front:function(){return Hd(54,16)+F([54,23,54,52])+F([54,52,48,82])+F([54,52,60,82])+F([54,28,84,28])+Db(90,28)},
  lunge:function(){return Hd(56,14)+F([56,21,56,50])+F([56,50,78,56,80,82])+F([56,50,42,70,26,80])+F([56,26,58,48])+Db(58,54)},
  pushup:function(){return Hd(26,44)+F([32,48,94,72])+F([42,52,42,82])+F([94,72,100,82])},
  plank:function(){return Hd(26,50)+F([32,54,94,74])+F([40,58,40,80,56,80])+F([94,74,100,82])},
  dip:function(){return Ln(28,50,92,50,4)+Ln(36,50,36,84,3,.35)+Ln(84,50,84,84,3,.35)+Hd(60,20)+F([60,27,58,54])+F([60,31,48,40,52,50])+F([58,54,64,70,52,78])},
  legpress:function(){return Ln(66,62,106,22,3,.35)+Ln(86,16,104,40,7)+Rc(18,62,30,6)+Ln(20,40,30,64,6)+Hd(24,42)+F([30,48,52,66])+F([52,66,70,44,90,30])},
  legcurl:function(){return Rc(14,56,72,6)+Ln(22,62,22,82,4)+Ln(78,62,78,82,4)+Hd(22,48)+F([28,50,62,50])+F([62,50,84,50,86,34])+'<circle class="eq" cx="90" cy="32" r="5"/>'},
  legext:function(){return Rc(36,56,30,6)+Ln(38,28,40,58,6)+Ln(50,62,50,82,4)+Hd(46,22)+F([48,29,52,54])+F([52,54,72,54,92,52])+'<circle class="eq" cx="94" cy="58" r="5"/>'},
  calf:function(){return Rc(38,76,44,10)+Hd(60,10)+F([60,17,60,46])+F([60,46,58,72,62,76])+F([60,46,62,72,66,76])+F([60,22,66,44])+Db(66,48)},
  crunch:function(){return Ln(10,84,110,84,5)+Hd(32,58)+F([38,62,58,78])+F([58,78,74,60,90,80])+F([38,62,30,52])},
  hang:function(){return Ln(26,8,94,8,4)+Ln(26,8,26,84,3,.35)+Ln(94,8,94,84,3,.35)+Hd(60,24)+F([54,34,48,9])+F([66,34,72,9])+F([60,31,60,56])+F([60,56,90,52])},
  thrust:function(){return Rc(8,48,24,8)+Ln(14,56,14,84,4)+Hd(16,40)+F([24,46,60,48])+F([60,48,78,58,80,82])+Pl(58,40,9)},
  swing:function(){return Hd(50,20)+F([52,27,60,52])+F([60,52,56,82])+F([60,52,68,82])+F([54,31,86,38])+Kb(92,40)},
  carry:function(){return Hd(60,12)+F([60,19,60,50])+F([60,50,50,82])+F([60,50,72,80])+F([60,24,60,48])+Kb(60,56)},
  run:function(){return Hd(64,12)+F([62,19,56,44])+F([56,44,72,58,66,80])+F([56,44,46,62,30,64])+F([60,24,70,36,80,30])+F([60,24,48,34,44,44])},
  bike:function(){return '<circle class="eqs" cx="30" cy="66" r="15" stroke-width="4"/><circle class="eqs" cx="90" cy="66" r="15" stroke-width="4"/>'+Ln(30,66,54,46,3)+Ln(54,46,90,66,3)+Ln(54,46,78,38,3)+Hd(64,16)+F([62,23,52,44])+F([52,44,66,58,58,74])+F([60,27,78,38])},
  rower:function(){return Ln(8,80,112,80,4)+'<circle class="eqs" cx="100" cy="62" r="12" stroke-width="4"/>'+Ln(88,62,72,56,2)+Hd(38,38)+F([40,45,44,72])+F([44,72,64,56,80,74])+F([42,50,60,56,72,56])},
  rope:function(){return '<ellipse class="eqs" cx="60" cy="46" rx="34" ry="40" stroke-width="3"/>'+Hd(60,16)+F([60,23,60,50])+F([60,50,54,74,58,80])+F([60,50,66,74,62,80])+F([60,28,48,44])+F([60,28,72,44])}
};
/* Real photos (free-exercise-db, public domain): two frames per exercise, start and finish.
   They arrive from the board as data: URLs and become short blob: URLs once, so a
   re-render never copies the image bytes. The drawings stay as the fallback. */
var PHOTOS={};
function loadPhotos(){
  if(!window.Pulse||typeof window.Pulse.asset!=='function')return;
  window.Pulse.asset('train-photos').then(function(d){
    Object.keys(d||{}).forEach(function(n){PHOTOS[n]=(d[n]||[]).map(function(u){var b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return URL.createObjectURL(new Blob([a],{type:'image/jpeg'}))})});
    render();
  },function(e){console.warn('exercise photos did not load; showing drawings',e)});
}
function photo(ex,i){var ph=PHOTOS[ex.name];return ph&&ph[i]?'<img class="photo" src="'+ph[i]+'" alt="'+K.esc(ex.name)+(i?' (finish)':' (start)')+'">':''}
function fig(ex,cls){
  if(PHOTOS[ex.name]&&cls!=='draw')return photo(ex,0);
  var f=FIG[ex.pat]||FIG.curl,body=f(ex.eq);
  // the figure's own strokes again, wider and in the backdrop colour, so limbs that cross read as separate shapes
  var people=(body.match(/<path class="p"[^>]*\/>|<circle class="hd"[^>]*\/>/g)||[]).join('');
  var gear=body.replace(/<path class="p"[^>]*\/>|<circle class="hd"[^>]*\/>/g,'');
  return '<svg class="fig '+(cls||'')+'" viewBox="0 0 120 90" role="img" aria-label="'+K.esc(ex.name)+'"><ellipse class="sh" cx="60" cy="86" rx="40" ry="3.5"/><line class="gr" x1="8" y1="86" x2="112" y2="86"/><g class="halo">'+people+'</g><g class="lift">'+gear+'</g>'+people+'</svg>';
}

/* ── the body map: front and back, primary muscles solid, helpers lighter ── */
function bodymap(pri,sec){
  pri=pri||[];sec=sec||[];
  function m(key,shape){var c=pri.indexOf(key)>-1?' pri':sec.indexOf(key)>-1?' sec':'';return shape.replace('<rect','<rect class="m'+c+'"').replace('<ellipse','<ellipse class="m'+c+'"')}
  function r(x,y,w,h,rx){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(rx||5)+'"/>'}
  function el(cx,cy,rx,ry){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'"/>'}
  function body(o,front){
    var s='<circle class="sk" cx="'+(o+40)+'" cy="12" r="9"/><rect class="sk" x="'+(o+36)+'" y="19" width="8" height="6" rx="2"/>';
    if(front){
      s+=m('shoulders',el(o+19,31,8,7))+m('shoulders',el(o+61,31,8,7))+m('chest',r(o+23,26,16,17,6))+m('chest',r(o+41,26,16,17,6))
       +m('abs',r(o+30,45,20,27,5))+m('obliques',r(o+23,46,6,22,3))+m('obliques',r(o+51,46,6,22,3))
       +m('biceps',r(o+8,36,10,21,5))+m('biceps',r(o+62,36,10,21,5))+m('forearms',r(o+5,59,9,22,4))+m('forearms',r(o+66,59,9,22,4))
       +m('quads',r(o+22,76,16,36,7))+m('quads',r(o+42,76,16,36,7))+m('calves',r(o+23,116,13,27,6))+m('calves',r(o+44,116,13,27,6));
    }else{
      s+=m('traps',r(o+29,23,22,10,4))+m('shoulders',el(o+19,31,8,7))+m('shoulders',el(o+61,31,8,7))
       +m('upper-back',r(o+22,34,36,21,7))+m('lower-back',r(o+28,56,24,15,5))
       +m('triceps',r(o+8,36,10,21,5))+m('triceps',r(o+62,36,10,21,5))+m('forearms',r(o+5,59,9,22,4))+m('forearms',r(o+66,59,9,22,4))
       +m('glutes',r(o+22,72,36,17,8))+m('hamstrings',r(o+22,91,16,23,6))+m('hamstrings',r(o+42,91,16,23,6))+m('calves',r(o+23,116,13,27,6))+m('calves',r(o+44,116,13,27,6));
    }
    return s;
  }
  return '<svg class="bodymap" viewBox="0 0 200 158" role="img" aria-label="Muscles: '+K.esc(pri.concat(sec).join(', '))+'">'+body(10,true)+body(110,false)+'<text x="50" y="155">FRONT</text><text x="150" y="155">BACK</text></svg>';

  s.exercises.forEach(function(name){

    out+='<section class="k-card exc"><div class="exc-head"><button class="pic" data-info="'+K.esc(name)+'" aria-label="How to do '+K.esc(name)+'" style="border:0;padding:0">'+fig(ex)+'</button><div class="k-main"><b>'+K.esc(name)+'</b><span>'+K.esc((ex.pri.concat(ex.sec).slice(0,3).join(', ')||ex.group))+(b&&!c?' · best '+fmtW(b.w)+'×'+b.r:'')+'</span></div><button class="k-x" data-drop="'+K.esc(name)+'" aria-label="Remove '+K.esc(name)+' from this workout">'+K.icon('close')+'</button></div>'
      +'<div class="sets"><div class="set hdr"><span style="text-align:center">Set</span><span style="text-align:center">Last time</span><span style="text-align:center">'+(c?'km':state.unit)+'</span><span style="text-align:center">'+(c?'min':'Reps')+'</span><span></span></div>'
      +rows.map(function(r,i){var p=prev[i];return '<div class="set'+(r.done?' done':'')+'"><span class="n">'+(i+1)+'</span><span class="prev">'+(p?fmtW(p.w)+(c?' km · ':' × ')+p.r+(c?' min':''):'—')+'</span><input inputmode="decimal" aria-label="Set '+(i+1)+' '+(c?'distance':'weight')+'" data-w="'+i+'" data-n="'+K.esc(name)+'" value="'+(r.w||'')+'" placeholder="0"><input inputmode="numeric" aria-label="Set '+(i+1)+' '+(c?'minutes':'reps')+'" data-r="'+i+'" data-n="'+K.esc(name)+'" value="'+(r.r||'')+'" placeholder="0"><button class="ok" data-done="'+i+'" data-n="'+K.esc(name)+'" aria-pressed="'+!!r.done+'" aria-label="Set '+(i+1)+' done">'+K.icon('check')+'</button></div>'}).join('')
      +'</div><div class="k-row-btns"><button class="k-btn k-soft k-sm" data-addset="'+K.esc(name)+'">'+K.icon('plus')+'Add set</button>'+(rows.length&&!rows[rows.length-1].done?'<button class="k-btn k-ghost k-sm" data-delset="'+K.esc(name)+'">'+K.icon('minus')+'Remove last</button>':'')+'</div></section>';
  });
  out+='<button class="k-btn k-ghost k-wide" data-tab="library">'+K.icon('search')+'Add an exercise</button>'
    +'<div class="k-row-btns"><button class="k-btn k-danger" data-discard>Discard</button><button class="k-btn k-ghost" data-saveroutine>Save as routine</button><button class="k-btn" data-finish>'+K.icon('check')+'Finish</button></div><div class="bottomspace"></div>';
  return out;
}

function viewLibrary(){
  var q=filt.q.toLowerCase(),inS=state.session?state.session.exercises:[];
  var names=allNames(),list=names.map(find).filter(function(e){return (filt.group==='All'||e.group===filt.group||(filt.group==='Yours'&&e.own))&&(!filt.eq||e.eq===filt.eq)&&(!q||(e.name+' '+e.pri.join(' ')+' '+e.sec.join(' ')+' '+e.group+' '+e.eq).toLowerCase().indexOf(q)>-1)});
  return '<div class="k-search">'+K.icon('search')+'<input class="k-input" id="q" type="search" placeholder="Search '+names.length+' exercises, muscles or equipment" value="'+K.esc(filt.q)+'" aria-label="Search exercises"></div>'
    +'<div class="k-chips k-scroll" role="group" aria-label="Muscle group">'+GROUPS.concat(state.exercises.length?['Yours']:[]).map(function(g){return '<button class="k-chip" data-group="'+g+'" aria-pressed="'+(filt.group===g)+'">'+g+'</button>'}).join('')+'</div>'
    +'<div class="k-chips k-scroll" role="group" aria-label="Equipment">'+EQUIP.map(function(g){return '<button class="k-chip" data-eqf="'+g+'" aria-pressed="'+(filt.eq===g)+'">'+g+'</button>'}).join('')+'</div>'
    +(list.length?'<div class="lib">'+list.map(function(e){var on=inS.indexOf(e.name)>-1;return '<button class="ex" data-info="'+K.esc(e.name)+'"><div class="pic">'+fig(e)+'</div><b>'+K.esc(e.name)+'</b><span>'+(on?'<span class="in">'+K.icon('check')+'In workout</span>':K.esc((e.pri[0]||e.group).replace('-',' ')+' · '+e.eq))+'</span></button>'}).join('')+'</div>'
      :'<div class="k-card k-empty">'+K.icon('search')+'<b>Nothing matches</b><span>Add it as your own exercise.</span></div>')
    +'<button class="k-btn k-ghost k-wide" data-own>'+K.icon('plus')+'Create your own exercise</button>'
    +'<p class="k-note">Exercise photos: free-exercise-db, public domain.</p>';
}

function info(name){
  var e=find(name),b=best(name),list=sets(name),c=isCardio(name),inS=state.session&&state.session.exercises.indexOf(name)>-1;
  var byDay={};list.forEach(function(x){var d=dayOf(x.at);byDay[d]=Math.max(byDay[d]||0,c?x.w:e1rm(x.w,x.r))});var ks=Object.keys(byDay).sort().slice(-20);
  K.sheet(name,
    (PHOTOS[e.name]?'<div class="pair"><figure class="pic">'+photo(e,0)+'<figcaption>Start</figcaption></figure><figure class="pic">'+photo(e,1)+'<figcaption>Finish</figcaption></figure></div>'
      :'<div class="pic demo" style="aspect-ratio:16/9">'+fig(e)+'</div>')
    +'<div class="k-chips"><span class="k-tag">'+K.esc(e.group)+'</span><span class="k-tag k-neutral">'+K.esc(e.eq)+'</span>'+e.pri.map(function(m){return '<span class="k-tag">'+K.esc(m.replace('-',' '))+'</span>'}).join('')+'</div>'
    +(e.pri.length?'<section class="k-card"><div class="k-label" style="margin-bottom:6px">Muscles worked · solid = main, light = helpers</div>'+bodymap(e.pri,e.sec)+'</section>':'')
    +(e.steps.length?'<section><div class="k-label" style="margin-bottom:10px">How to do it</div><ol class="steps">'+e.steps.map(function(s){return '<li>'+K.esc(s)+'</li>'}).join('')+'</ol>'+(e.tip?'<p class="k-sub" style="margin-top:12px">'+K.icon('star')+' '+K.esc(e.tip)+'</p>':'')+'</section>':'')
    +'<section class="k-card"><div class="k-label">Your numbers</div>'+(b?'<div class="k-grid k-2" style="margin-top:10px"><div><div class="k-sub">Best set</div><div class="k-mid">'+fmtW(b.w)+'<small>'+(c?'km':state.unit)+' × '+b.r+'</small></div></div><div><div class="k-sub">'+(c?'Sessions':'Est. 1-rep max')+'</div><div class="k-mid">'+(c?ks.length:K.fmt(b.v,1)+'<small>'+state.unit+'</small>')+'</div></div></div>'+(ks.length>1?'<div style="margin-top:12px">'+K.line(ks.map(function(k){return byDay[k]}),{height:110,labels:[dateLabel(ks[0]),dateLabel(ks[ks.length-1])],label:'Progress on '+name})+'</div>':'')
      :'<p class="k-sub" style="margin:8px 0 0">Not logged yet. Your best set and progress line show up after the first workout.</p>')+'</section>'
    +(inS?'<button class="k-btn k-ghost k-wide" data-k-close>Already in this workout</button>':'<button class="k-btn k-wide" data-addex>'+K.icon('plus')+(state.session&&state.session.exercises.length?'Add to workout':'Start a workout with this')+'</button>'),
    function(el,close){var a=el.querySelector('[data-addex]');if(a)a.onclick=function(){if(state.session&&state.session.exercises.length)addToSession(name);else startSession([name]);tab='today';persist();close();render()}});
}

function viewHistory(){
  var list=state.sessions.slice().reverse();
  var logged={};Object.keys(state.log).forEach(function(n){sets(n).forEach(function(x){logged[dayOf(x.at)]=1})});
  var known={};list.forEach(function(s){known[s.date]=1});
  Object.keys(logged).forEach(function(d){if(!known[d]&&(!state.session||state.session.date!==d))list.push({date:d,legacy:true})});
  list.sort(function(a,b){return (b.date+(b.finishedAt||0))>(a.date+(a.finishedAt||0))?1:-1});
  if(!list.length)return '<div class="k-card k-empty">'+K.icon('calendar')+'<b>No workouts yet</b><span>Finished workouts land here with every set.</span></div>';
  // the last 12 weeks, one dot per day trained
  var trained={};list.forEach(function(s){trained[s.date]=1});
  var cal='',t0=new Date(),d0=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()-((t0.getDay()+6)%7)-77);
  for(var i=0;i<84;i++){var d=new Date(d0);d.setDate(d0.getDate()+i);var k=K.dayKey(d),fut=k>K.dayKey();cal+='<i title="'+k+'" style="aspect-ratio:1;border-radius:4px;display:block;background:'+(fut?'transparent':trained[k]?'var(--k-tint)':'color-mix(in srgb,var(--k-text) 8%,transparent)')+'"></i>'}
  return '<section class="k-card"><div class="k-label" style="margin-bottom:10px">Last 12 weeks · '+Object.keys(trained).filter(function(k){var x=new Date();x.setDate(x.getDate()-84);return k>=K.dayKey(x)}).length+' training days</div><div style="display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px">'+cal+'</div></section>'
    +'<div class="k-list">'+list.slice(0,40).map(function(s){var names=s.exercises||Object.keys(state.log).filter(function(n){return sets(n).some(function(x){return dayOf(x.at)===s.date})});return '<button class="k-row" data-day="'+s.date+'"><span class="k-ico">'+K.icon('dumbbell')+'</span><span class="k-main"><b>'+dateLabel(s.date)+'</b><span>'+K.esc(names.join(' · ')||'—')+'</span></span><span class="k-end">'+(s.sets!=null?s.sets+'<small>sets</small>':names.length+'<small>exercises</small>')+'</span>'+K.icon('chev','k-chev')+'</button>'}).join('')+'</div>';
}
function dayDetail(day){
  var names=Object.keys(state.log).filter(function(n){return sets(n).some(function(x){return dayOf(x.at)===day})});
  var sess=state.sessions.filter(function(s){return s.date===day})[0];
  K.sheet(dateLabel(day),(sess&&sess.startedAt?'<p class="k-sub" style="margin:0">'+dur(sess.finishedAt-sess.startedAt)+(sess.volume?' · '+K.fmt(sess.volume,0)+' '+state.unit+' moved':'')+'</p>':'')
    +names.map(function(n){var c=isCardio(n),list=sets(n).filter(function(x){return dayOf(x.at)===day});return '<section class="k-card exc"><div class="exc-head"><div class="pic">'+fig(find(n))+'</div><div class="k-main"><b>'+K.esc(n)+'</b><span>'+list.length+' set'+(list.length===1?'':'s')+'</span></div></div><div class="k-chips">'+list.map(function(x){return '<span class="k-tag k-neutral">'+fmtW(x.w)+(c?' km · '+x.r+' min':' × '+x.r)+'</span>'}).join('')+'</div></section>'}).join('')
    +'<button class="k-btn k-danger k-wide" data-delday>'+K.icon('trash')+'Delete this workout</button>',
    function(el,close){el.querySelector('[data-delday]').onclick=function(){K.sheet('Delete '+dateLabel(day)+'?','<p style="margin:0">Every set from this day is removed. Your bests are recalculated.</p><div class="k-row-btns"><button class="k-btn k-ghost" data-k-close>Keep it</button><button class="k-btn" data-yes>Delete</button></div>',function(el2,close2){el2.querySelector('[data-yes]').onclick=function(){names.forEach(function(n){state.log[n]=state.log[n].filter(function(x){return dayOf(x.at)!==day})});state.sessions=state.sessions.filter(function(s){return s.date!==day});persist();close2();close();render()}})}});
}

function viewProgress(){
  var weeks=[],labels=[],counts=[],now=new Date(),mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7));
  for(var i=7;i>=0;i--){var a=new Date(mon);a.setDate(mon.getDate()-7*i);var b=new Date(a);b.setDate(a.getDate()+7);var ak=K.dayKey(a),bk=K.dayKey(b),v=0,days={};
    Object.keys(state.log).forEach(function(n){if(isCardio(n))return;sets(n).forEach(function(x){var d=dayOf(x.at);if(d>=ak&&d<bk){v+=x.w*x.r;days[d]=1}})});
    weeks.push(Math.round(v));counts.push(Object.keys(days).length);labels.push(i===0?'Now':(a.getMonth()+1)+'/'+a.getDate())}
  var month=new Date();month.setDate(month.getDate()-30);var mk=K.dayKey(month),split={};
  Object.keys(state.log).forEach(function(n){var g=find(n).group;sets(n).forEach(function(x){if(dayOf(x.at)>=mk)split[g]=(split[g]||0)+1})});
  var gs=Object.keys(split).sort(function(a,b){return split[b]-split[a]}),mx=gs.length?split[gs[0]]:1;
  // muscles trained in the last 7 days: main movers solid, helpers light (like Hevy's body graph)
  var w7=new Date();w7.setDate(w7.getDate()-6);var w7k=K.dayKey(w7),wk={pri:[],sec:[]};
  Object.keys(state.log).forEach(function(n){if(!sets(n).some(function(x){return dayOf(x.at)>=w7k}))return;var e=find(n);e.pri.forEach(function(m){if(wk.pri.indexOf(m)<0)wk.pri.push(m)});e.sec.forEach(function(m){if(wk.sec.indexOf(m)<0)wk.sec.push(m)})});
  wk.sec=wk.sec.filter(function(m){return wk.pri.indexOf(m)<0});
  var lifts=Object.keys(state.log).filter(function(n){return !isCardio(n)&&sets(n).length}).map(function(n){return {n:n,b:best(n),c:sets(n).length}}).sort(function(a,b){return b.c-a.c}).slice(0,8);
  return '<div class="k-grid k-3"><div class="k-stat"><div class="k-label">This week</div><div class="k-mid">'+counts[7]+'</div><div class="k-sub">training days</div></div><div class="k-stat"><div class="k-label">Volume</div><div class="k-mid">'+K.fmt(weeks[7]/1000,1)+'<small>t</small></div><div class="k-sub">'+(weeks[6]?(weeks[7]>=weeks[6]?'<span class="k-up">▲ ':'<span class="k-down">▼ ')+K.fmt(Math.abs(weeks[7]-weeks[6])/Math.max(1,weeks[6])*100,0)+'%</span> vs last week':'this week')+'</div></div><div class="k-stat"><div class="k-label">All time</div><div class="k-mid">'+state.sessions.length+'</div><div class="k-sub">workouts finished</div></div></div>'
    +'<h2 class="k-title">Weekly volume<span class="k-label">'+state.unit+' × reps</span></h2><section class="k-card">'+K.bars(weeks,{labels:labels,now:7,height:150,fmt:function(v){return K.fmt(v,0)+' '+state.unit},label:'Volume per week'})+'</section>'
    +'<h2 class="k-title">Muscles this week<span class="k-label">last 7 days</span></h2><section class="k-card">'+(wk.pri.length?bodymap(wk.pri,wk.sec):'<p class="k-sub" style="margin:0">Log a workout and the muscles you trained light up here.</p>')+'</section>'
    +'<h2 class="k-title">Muscle balance<span class="k-label">sets, last 30 days</span></h2><section class="k-card">'+(gs.length?'<div class="split">'+gs.map(function(g){return '<div><span>'+g+'</span><i style="width:'+(split[g]/mx*100).toFixed(0)+'%"></i><em>'+split[g]+'</em></div>'}).join('')+'</div>':'<p class="k-sub" style="margin:0">Log a few workouts to see which muscles get the most work.</p>')+'</section>'
    +'<h2 class="k-title">Your lifts<span class="k-label">best set · est. 1RM</span></h2>'
    +(lifts.length?'<div class="k-list">'+lifts.map(function(l){return '<button class="k-row" data-info="'+K.esc(l.n)+'"><span class="pic" style="width:52px;height:40px;flex:none">'+fig(find(l.n))+'</span><span class="k-main"><b>'+K.esc(l.n)+'</b><span>'+fmtW(l.b.w)+' × '+l.b.r+' · '+l.c+' sets logged</span></span><span class="k-end pr">'+K.fmt(l.b.v,1)+'<small>'+state.unit+' 1RM</small></span>'+K.icon('chev','k-chev')+'</button>'}).join('')+'</div>'
      :'<div class="k-card k-empty">'+K.icon('chart')+'<b>No lifts yet</b><span>Your best sets and estimated maxes show up here.</span></div>')
    +'<h2 class="k-title">Settings</h2><div class="k-list"><button class="k-row" data-unit><span class="k-ico">'+K.icon('scale')+'</span><span class="k-main"><b>Weight unit</b><span>Labels only; numbers stay as typed</span></span><span class="k-end">'+state.unit+'</span>'+K.icon('chev','k-chev')+'</button><button class="k-row" data-restset><span class="k-ico">'+K.icon('timer')+'</span><span class="k-main"><b>Rest timer</b><span>Starts when you tick a set</span></span><span class="k-end">'+state.rest+'<small>sec</small></span>'+K.icon('chev','k-chev')+'</button></div>';
}

function render(){
  var html=header();
  html+=tab==='today'?viewToday():tab==='library'?viewLibrary():tab==='history'?viewHistory():viewProgress();
  document.getElementById('app').innerHTML=html;
}

/* ── events ── */
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){filt.q=t.value;var pos=t.selectionStart;render();var q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos)}catch(x){}return}
  if(t.hasAttribute('data-w'))updateSet(t.getAttribute('data-n'),Number(t.getAttribute('data-w')),'w',t.value);
  if(t.hasAttribute('data-r'))updateSet(t.getAttribute('data-n'),Number(t.getAttribute('data-r')),'r',t.value);
});
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.closest('.k-sheet'))return;
  var a=function(n){return b.getAttribute(n)};
  if(a('data-tab')!=null){tab=a('data-tab');render();window.scrollTo(0,0);return}
  if(b.hasAttribute('data-start')){startSession([]);tab='library';render();return}
  if(a('data-routine')!=null){var all=state.routines.concat(ROUTINES),r=all[Number(a('data-routine'))];startSession(r.exercises);return}
  if(a('data-quick')!=null){startSession([a('data-quick')]);return}
  if(a('data-info')!=null){info(a('data-info'));return}
  if(a('data-group')!=null){filt.group=a('data-group');render();return}
  if(a('data-eqf')!=null){filt.eq=filt.eq===a('data-eqf')?'':a('data-eqf');render();return}
  if(a('data-done')!=null){toggleSet(a('data-n'),Number(a('data-done')));return}
  if(a('data-addset')!=null){var n=a('data-addset'),rows=sessionSets()[n],l=rows[rows.length-1]||{w:0,r:8};rows.push({w:l.w,r:l.r,done:false});persist();render();return}
  if(a('data-delset')!=null){var rr=sessionSets()[a('data-delset')];if(rr.length&&!rr[rr.length-1].done)rr.pop();persist();render();return}
  if(a('data-drop')!=null){var dn=a('data-drop'),drows=sessionSets()[dn]||[];if(drows.some(function(x){return x.done})){K.toast('Untick its sets first, or keep it: ticked sets are already in your log.');return}state.session.exercises=state.session.exercises.filter(function(x){return x!==dn});delete sessionSets()[dn];persist();render();return}
  if(b.hasAttribute('data-finish')){finish();return}
  if(b.hasAttribute('data-discard')){K.sheet('Discard this workout?','<p style="margin:0">Ticked sets stay in your log. Only the unticked rows and the timer go.</p><div class="k-row-btns"><button class="k-btn k-ghost" data-k-close>Keep going</button><button class="k-btn" data-yes>Discard</button></div>',function(el,close){el.querySelector('[data-yes]').onclick=function(){state.session=null;stopRest();persist();close();render()}});return}
  if(b.hasAttribute('data-saveroutine')||b.hasAttribute('data-newroutine')){var pre=b.hasAttribute('data-saveroutine')?state.session.exercises.slice():[];
    K.sheet('Save a routine','<label class="k-field"><span>Name</span><input class="k-input" id="rn" maxlength="40" placeholder="e.g. Monday push"></label>'+(pre.length?'<p class="k-sub" style="margin:0">'+pre.map(K.esc).join(' · ')+'</p>':'<p class="k-sub" style="margin:0">Starts empty: start it, add exercises, then save the workout as a routine again.</p>')+'<button class="k-btn k-wide" data-yes>Save routine</button>',function(el,close){el.querySelector('[data-yes]').onclick=function(){var nm=el.querySelector('#rn').value.trim();if(!nm){el.querySelector('#rn').focus();return}state.routines.unshift({name:nm.slice(0,40),exercises:pre,why:'Your routine.'});persist();close();K.toast('Saved "'+nm+'".');render()}});return}
  if(b.hasAttribute('data-own')){K.sheet('Your own exercise','<label class="k-field"><span>Name</span><input class="k-input" id="on" maxlength="40" value="'+K.esc(filt.q)+'" placeholder="e.g. Sled push"></label><button class="k-btn k-wide" data-yes>Add exercise</button>',function(el,close){el.querySelector('[data-yes]').onclick=function(){var nm=el.querySelector('#on').value.trim().slice(0,40);if(!nm)return;if(allNames().indexOf(nm)<0)state.exercises.push(nm);if(state.session&&state.session.exercises.length)addToSession(nm);persist();close();filt.q='';render();K.toast(nm+' added.')}});return}
  if(a('data-day')!=null){dayDetail(a('data-day'));return}
  if(b.hasAttribute('data-unit')){state.unit=state.unit==='kg'?'lb':'kg';persist();render();return}
  if(b.hasAttribute('data-restset')){K.sheet('Rest timer','<div class="k-chips">'+[45,60,90,120,180,240].map(function(s){return '<button class="k-chip" data-rs="'+s+'" aria-pressed="'+(state.rest===s)+'">'+(s<60?s+' sec':s/60+' min')+'</button>'}).join('')+'</div><p class="k-note">Heavy compound lifts like 2–3 minutes; small exercises 60–90 seconds.</p>',function(el,close){el.addEventListener('click',function(ev){var x=ev.target.closest('[data-rs]');if(x){state.rest=Number(x.getAttribute('data-rs'));persist();close();render()}})});return}
  if(a('data-rest')!=null){var v=a('data-rest');if(v==='skip')stopRest();else{restEnd+=Number(v)*1000;restLen=Math.max(restLen+Number(v),1);drawRest()}return}
});
setInterval(function(){var el=document.getElementById('elapsed');if(el&&state&&state.session)el.textContent=dur(Date.now()-(state.session.startedAt||Date.now()))},20000);

(async function(){
  var raw=null;
  try{raw=await window.Pulse.load()}catch(e){K.toast('Could not load your training log: '+(e&&e.message||e))}
  state=norm(raw);
  loadPhotos();
  if(state.session&&!state.session.startedAt)state.session.startedAt=Date.now();
  render();
})();
</script>
</body>
</html>
